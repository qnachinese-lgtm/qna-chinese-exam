<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找不到頁面 - QNA 華語考試</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Serif TC','Microsoft JhengHei',serif; background:#f5f0e8; color:#2c2c2c; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.container { text-align:center; max-width:600px; padding:40px 20px; }
.emoji { font-size:120px; margin-bottom:20px; animation:bounce 2s infinite; }
@keyframes bounce { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-30px); } }
h1 { font-size:2.5rem; color:#8b1a1a; margin:20px 0; font-weight:700; }
p { font-size:1.1rem; color:#666; margin:20px 0; line-height:1.6; }
.buttons { margin:40px 0; display:flex; gap:15px; justify-content:center; flex-wrap:wrap; }
button { padding:12px 32px; font-size:1rem; border:none; border-radius:8px; cursor:pointer; font-weight:600; transition:background .2s; }
.btn-home { background:#c0392b; color:#fff; }
.btn-home:hover { background:#a93226; }
.btn-back { background:#f5f5f5; color:#666; border:2px solid #ddd; }
.btn-back:hover { background:#eee; }
.footer { font-size:0.85rem; color:#999; margin-top:40px; }
</style>
</head>
<body>
<div class="container">
  <div class="emoji">😕</div>
  <h1>找不到頁面</h1>
  <p>看起來您訪問的頁面不存在或已被移除。<br>請回到首頁重新開始！</p>
  <div class="buttons">
    <button class="btn-home" onclick="window.location.href='/'">🏠 返回首頁</button>
    <button class="btn-back" onclick="window.history.back()">← 上一頁</button>
  </div>
  <div class="footer">錯誤代碼：404 | 找不到資源</div>
</div>
</body>
</html>
