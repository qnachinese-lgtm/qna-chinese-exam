<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者後臺 - 對外華語教學認證模擬考</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Serif TC','Microsoft JhengHei',serif; background:#f5f0e8; color:#2c2c2c; min-height:100vh; }
main { max-width:880px; margin:0 auto; padding:28px 16px; }

#admin-screen { display:none; padding:20px 0; }
.admin-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.admin-title { font-size:1.2rem; font-weight:700; flex:1; }
.admin-back { background:#f5f5f5; border:1px solid #ddd; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:.9rem; }
.admin-back:hover { background:#e8e8e8; }
.role-badge { font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px; }
.role-master { background:#fff3e0; color:#e65100; border:1px solid #ffcc80; }
.role-admin  { background:#e3f2fd; color:#1565c0; border:1px solid #90caf9; }
.admin-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.admin-table th { background:#4a90d9; color:#fff; padding:10px 14px; text-align:left; font-size:.85rem; }
.admin-table td { padding:10px 14px; font-size:.85rem; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
.admin-table tr:last-child td { border-bottom:none; }
.admin-table tr:hover td { background:#f8f9ff; }
.pw-cell { font-family:monospace; color:#555; white-space:nowrap; }
.admin-section { font-size:.78rem; color:#888; margin-bottom:12px; }
.admin-add-btn { background:linear-gradient(135deg,#4a90d9,#357abd); color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:.88rem; font-weight:600; cursor:pointer; margin-bottom:16px; }
.admin-add-btn:hover { opacity:.88; }
.admin-action-cell { display:flex; gap:6px; flex-wrap:nowrap; align-items:center; white-space:nowrap; }
.admin-edit-btn { background:#357abd; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-edit-btn:hover { background:#1a5fa8; }
.admin-pw-btn { background:#9c27b0; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-pw-btn:hover { background:#7b1fa2; }
.admin-reset-btn { background:#ff9800; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-reset-btn:hover { background:#f57c00; }
.admin-delete-btn { background:#c62828; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-delete-btn:hover { background:#ad1457; }

/* Modal */
#admin-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
.admin-modal { background:#fff; border-radius:16px; padding:28px 24px; width:320px; max-width:90vw; }
.admin-modal h3 { margin:0 0 20px; font-size:1.05rem; }
.admin-modal label { display:block; font-size:.82rem; color:#666; margin-bottom:4px; margin-top:12px; }
.admin-modal input { width:100%; box-sizing:border-box; padding:10px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:.95rem; outline:none; }
.admin-modal input:focus { border-color:#4a90d9; }
.modal-error { color:#c62828; font-size:.8rem; margin-top:8px; min-height:16px; }
.modal-btns { display:flex; gap:10px; justify-content:space-between; margin-top:20px; }
.modal-btn-primary { background:#4a90d9; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:.88rem; cursor:pointer; font-weight:600; flex:1; }
.modal-btn-primary:hover { background:#357abd; }
.modal-btn-cancel { background:#e0e0e0; color:#333; border:none; border-radius:8px; padding:10px 20px; font-size:.88rem; cursor:pointer; font-weight:600; flex:1; }
.modal-btn-cancel:hover { background:#d0d0d0; }

/* Login screen */
#admin-login-screen { display:none; align-items:center; justify-content:center; min-height:100vh; }
.admin-login-box { background:#fff; border-radius:16px; padding:32px 28px; width:320px; max-width:90vw; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.1); }
.admin-login-box h3 { margin:0 0 4px; font-size:1.3rem; }
.admin-login-box p { color:#888; font-size:.85rem; margin:0 0 20px; }
.admin-login-box input { width:100%; box-sizing:border-box; padding:11px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:.95rem; margin-bottom:12px; outline:none; }
.admin-login-box input:focus { border-color:#4a90d9; }
.login-error { color:#c62828; font-size:.85rem; margin:6px 0; min-height:18px; }
.login-msg-ok { color:#2e7d32; font-size:.85rem; margin:6px 0; min-height:18px; }
.login-btn { width:100%; padding:12px; background:linear-gradient(135deg,#4a90d9,#357abd); color:#fff; border:none; border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; margin-bottom:10px; }
.login-btn:hover { opacity:.88; }
.link-btn { background:none; border:none; color:#4a90d9; font-size:.82rem; cursor:pointer; text-decoration:underline; }
#admin-forgot-box { display:none; margin-top:14px; background:#fff8e1; border:1px solid #ffe082; border-radius:8px; padding:14px; text-align:left; }
#admin-forgot-box p { font-size:.8rem; color:#5d4037; margin:0 0 8px; }
#boot-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; color:#888; font-size:.95rem; }

@media(max-width:520px){
  main { padding:16px; }
  .admin-modal { width:90%; }
  .admin-login-box { width:90%; }
  .admin-table { font-size:.75rem; }
  .admin-table th, .admin-table td { padding:6px 8px; }
}
</style>
<!-- Firebase（真驗證：Auth + Firestore） -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- 啟動中（檢查登入狀態時顯示，避免閃過後台） -->
<div id="boot-screen">載入中…</div>

<!-- 登入畫面 -->
<div id="admin-login-screen">
  <div class="admin-login-box">
    <h3>🔐 管理者後臺</h3>
    <p>請用管理員 Email 與密碼登入</p>
    <input type="email" id="admin-email" placeholder="管理員 Email" autocomplete="username"
      onkeydown="if(event.key==='Enter')document.getElementById('admin-pw').focus()">
    <input type="password" id="admin-pw" placeholder="密碼" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')adminLogin()">
    <div class="login-error" id="admin-login-err"></div>
    <button class="login-btn" onclick="adminLogin()">登入 →</button>
    <button class="link-btn" onclick="toggleForgot()">忘記密碼？</button>

    <div id="admin-forgot-box">
      <p>🔑 輸入你的管理員 Email，我們會寄一封「重設密碼」信給你（Firebase 官方寄送）。</p>
      <input type="email" id="reset-email" placeholder="管理員 Email">
      <button class="login-btn" style="margin-bottom:0" onclick="sendReset()">寄送重設信</button>
      <div class="login-msg-ok" id="reset-msg"></div>
    </div>
  </div>
</div>

<main>
  <div id="admin-screen">
    <div class="admin-header">
      <button class="admin-back" onclick="adminLogout()">← 登出</button>
      <span class="admin-title">⚙️ 管理者後臺</span>
      <span id="role-badge" class="role-badge role-admin"></span>
      <button id="add-learner-btn" class="admin-add-btn" style="margin:0" onclick="openAddModal()">＋ 新增學習者帳號</button>
    </div>
    <div id="who-am-i" style="font-size:.8rem;color:#888;margin-bottom:16px"></div>

    <!-- 學習者名單 -->
    <div class="admin-header" style="margin-bottom:16px">
      <span class="admin-title">📚 學習者名單</span>
      <button id="cleanup-btn" onclick="cleanupDuplicates()" style="display:none;background:#ff7043;color:#fff;border:none;cursor:pointer;padding:8px 14px;border-radius:8px;font-weight:600;margin-right:8px">🧹 清除空殼</button>
      <button id="toggle-learners-btn" class="admin-back" onclick="toggleLearnersTable()" style="background:#4a90e2;color:#fff;border:none;cursor:pointer;padding:8px 16px;border-radius:8px">隱藏</button>
    </div>
    <div id="learners-table-container" style="overflow-x:auto;margin-bottom:30px">
    <table class="admin-table">
      <thead><tr id="learner-head"></tr></thead>
      <tbody id="admin-tbody"></tbody>
    </table>
    </div>

    <!-- 管理員白名單（僅主管理員可見） -->
    <div id="admins-section" style="border-top:2px solid #e0e0e0;padding-top:20px;display:none">
      <div class="admin-header" style="margin-bottom:8px">
        <span class="admin-title">👤 管理員存取權限</span>
        <button class="admin-add-btn" style="margin:0" onclick="openAdminAddModal()">＋ 新增管理員帳號</button>
      </div>
      <div class="admin-section">只有主管理員（qnachinese@gmail.com）能新增/刪除其他管理員。其他管理員只能查看學習者資料。</div>

      <div style="overflow-x:auto">
      <table class="admin-table">
        <thead><tr><th>管理員 Email</th><th>角色</th><th style="text-align:center">操作</th></tr></thead>
        <tbody id="admins-tbody"></tbody>
      </table>
      </div>
    </div>
  </div>
</main>

<!-- 編輯/新增學習者 Modal -->
<div id="admin-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center">
  <div class="admin-modal">
    <h3 id="modal-title">編輯帳號</h3>
    <input type="hidden" id="modal-idx">
    <label>名稱</label>
    <input type="text" id="modal-name" placeholder="帳號名稱" maxlength="20">
    <label>密碼（留空則不修改）</label>
    <input type="password" id="modal-pw" placeholder="新密碼（留空不改）">
    <label>Gmail（忘記密碼使用）</label>
    <input type="email" id="modal-email" placeholder="Gmail 信箱">
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-btns">
      <button class="modal-btn-primary" onclick="saveModal()">儲存</button>
      <button class="modal-btn-cancel"  onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<!-- 新增管理員帳號 Modal -->
<div id="admin-add-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center">
  <div class="admin-modal">
    <h3 id="admin-add-title">新增管理員帳號</h3>
    <label>名稱（顯示用，可自訂）</label>
    <input type="text" id="newadmin-name" placeholder="例如：王老師" maxlength="20">
    <label>管理員 Email</label>
    <input type="email" id="newadmin-email" placeholder="對方的 Email">
    <label>密碼（至少6碼）</label>
    <input type="text" id="newadmin-pw" placeholder="幫他設定的密碼">
    <div class="modal-error" id="newadmin-error"></div>
    <div style="font-size:.75rem;color:#999;margin-top:6px">建立後把這組帳密給對方。一般管理員登入後只能查看學習者，不能修改。</div>
    <div class="modal-btns">
      <button class="modal-btn-primary" onclick="addAdmin()">儲存</button>
      <button class="modal-btn-cancel"  onclick="closeAdminAddModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  設定
// ═══════════════════════════════════════════
const USERS_KEY   = 'tocfl_users';
const STORAGE_KEY = 'tocfl_exam_history';
const MASTER_EMAIL = 'qnachinese@gmail.com';   // 主管理員（永遠有權限、唯一能管理其他管理員）

const FB_CONFIG = {
  apiKey: "AIzaSyCSgZ9DmLuKIqqbxrVgAcUfy-QJFhzjjp8",
  authDomain: "qna-chinese.firebaseapp.com",
  projectId: "qna-chinese",
  storageBucket: "qna-chinese.firebasestorage.app",
  messagingSenderId: "645044163415",
  appId: "1:645044163415:web:c33d1a22422de3083b6412"
};
firebase.initializeApp(FB_CONFIG);
const auth = firebase.auth();
const _db  = firebase.firestore();

let _currentRole = null;   // 'master' | 'admin'
let _currentEmail = null;
let _adminEmails = new Set([MASTER_EMAIL]);   // 管理員 email,用來從學習者名單濾掉

// ═══════════════════════════════════════════
//  授權判斷
// ═══════════════════════════════════════════
const ADMIN_CLIENT_KEY = 'tocfl_admin_client';   // 一般管理員的登入狀態（主管理員走 Firebase）

async function getAdminAccounts(){
  try{
    const doc = await _db.collection('config').doc('admins').get();
    if(!doc.exists) return [];
    const data = doc.data();
    let accounts = Array.isArray(data.accounts) ? data.accounts.slice() : [];
    // 相容舊資料：把舊的 emails 清單併進 accounts（沒密碼，待主管理員重設）
    if(Array.isArray(data.emails)){
      let changed=false;
      data.emails.forEach(em=>{
        const e=(em||'').toLowerCase();
        if(e && e!==MASTER_EMAIL && !accounts.some(a=>(a.email||'').toLowerCase()===e)){ accounts.push({email:e, pw:''}); changed=true; }
      });
      if(changed){ _db.collection('config').doc('admins').set({accounts}, {merge:true}).catch(()=>{}); }
    }
    return accounts;
  }catch(e){ console.warn('getAdminAccounts:', e); return []; }
}
async function saveAdminAccounts(accounts){
  await _db.collection('config').doc('admins').set({accounts}, {merge:true});
}
async function getRole(email){
  if(!email) return null;
  email = email.toLowerCase();
  if(email === MASTER_EMAIL) return 'master';
  try{
    const accounts = await getAdminAccounts();
    return accounts.some(a=>(a.email||'').toLowerCase()===email) ? 'admin' : null;
  }catch(e){ console.warn('getRole:', e); return null; }
}

// ═══════════════════════════════════════════
//  登入 / 登出 / 忘記密碼
// ═══════════════════════════════════════════
function showScreen(which){
  document.getElementById('boot-screen').style.display       = which==='boot'  ? 'flex' : 'none';
  document.getElementById('admin-login-screen').style.display= which==='login' ? 'flex' : 'none';
  document.getElementById('admin-screen').style.display      = which==='panel' ? 'block': 'none';
}

async function adminLogin(){
  const email = (document.getElementById('admin-email').value||'').trim().toLowerCase();
  const pw    = document.getElementById('admin-pw').value;
  const err   = document.getElementById('admin-login-err');
  err.textContent='';
  if(!email){ err.textContent='請輸入 Email'; return; }
  if(!pw){ err.textContent='請輸入密碼'; return; }

  if(email !== MASTER_EMAIL){
    // 一般管理員：用主管理員設定的帳密（存雲端）比對
    const accounts = await getAdminAccounts();
    const acc = accounts.find(a=>(a.email||'').toLowerCase()===email);
    if(!acc){ err.style.color='#c62828'; err.textContent='此 Email 沒有後台權限'; return; }
    if(!acc.pw){ err.style.color='#c62828'; err.textContent='此帳號尚未設定密碼，請聯絡主管理員'; return; }
    if(acc.pw !== await hashPw(pw)){ err.style.color='#c62828'; err.textContent='密碼不正確'; return; }
    localStorage.setItem(ADMIN_CLIENT_KEY, email);
    enterPanel(email, 'admin', acc.name);
    return;
  }

  // 主管理員：Firebase 真驗證
  err.textContent='登入中…'; err.style.color='#888';
  try{
    await auth.signInWithEmailAndPassword(email, pw);
    // onAuthStateChanged 會接手顯示後台
  }catch(e){
    err.style.color='#c62828';
    if(e.code==='auth/user-not-found'){
      // 已授權但還沒設密碼 → 第一次設定
      if(pw.length < 6){ err.textContent='第一次設定密碼至少 6 碼'; return; }
      if(confirm('此 Email 尚未設定密碼。要用剛輸入的密碼建立帳號嗎？')){
        try{ await auth.createUserWithEmailAndPassword(email, pw); }
        catch(e2){ err.textContent = '建立失敗：'+(e2.code||e2.message); }
      } else { err.textContent=''; }
    } else if(e.code==='auth/wrong-password' || e.code==='auth/invalid-credential'){
      err.textContent='密碼錯誤';
    } else if(e.code==='auth/invalid-email'){
      err.textContent='Email 格式不正確';
    } else if(e.code==='auth/too-many-requests'){
      err.textContent='嘗試次數過多，請稍後再試';
    } else {
      err.textContent='登入失敗：'+(e.code||e.message);
    }
  }
}

function adminLogout(){
  localStorage.removeItem(ADMIN_CLIENT_KEY);
  if(auth.currentUser){ auth.signOut(); }
  else { _currentRole=null; _currentEmail=null; showScreen('login'); }
}

function toggleForgot(){
  const b = document.getElementById('admin-forgot-box');
  b.style.display = b.style.display==='block' ? 'none' : 'block';
  document.getElementById('reset-msg').textContent='';
  if(b.style.display==='block'){
    document.getElementById('reset-email').value = document.getElementById('admin-email').value || '';
  }
}

async function sendReset(){
  const email = (document.getElementById('reset-email').value||'').trim().toLowerCase();
  const msg = document.getElementById('reset-msg');
  msg.style.color='#c62828';
  if(!email){ msg.textContent='請輸入 Email'; return; }
  const role = await getRole(email);
  if(!role){ msg.textContent='此 Email 沒有後台權限'; return; }
  try{
    await auth.sendPasswordResetEmail(email);
    msg.style.color='#2e7d32';
    msg.textContent='✅ 重設信已寄至 '+email+'，請查收（含垃圾信匣）。';
  }catch(e){
    if(e.code==='auth/user-not-found'){
      msg.textContent='此 Email 還沒設過密碼，請直接在上方輸入 Email + 新密碼登入即可建立。';
    } else {
      msg.textContent='寄送失敗：'+(e.code||e.message);
    }
  }
}

// ═══════════════════════════════════════════
//  登入狀態變化（決定顯示哪個畫面）
// ═══════════════════════════════════════════
function enterPanel(email, role, name){
  _currentRole = role; _currentEmail = (email||'').toLowerCase();
  showScreen('panel');
  document.getElementById('who-am-i').textContent = '登入身分：'+_currentEmail;
  const badge=document.getElementById('role-badge');
  badge.textContent = role==='master' ? '主管理員' : ('管理員'+(name?'（'+name+'）':''));
  badge.className = 'role-badge ' + (role==='master'?'role-master':'role-admin');
  document.getElementById('add-learner-btn').style.display = role==='master' ? '' : 'none';
  document.getElementById('admins-section').style.display  = role==='master' ? 'block' : 'none';
  syncFromCloud();
  renderAdminPanel();
}

async function tryClientAdminSession(){
  const email = localStorage.getItem(ADMIN_CLIENT_KEY);
  if(!email) return;
  const accounts = await getAdminAccounts();
  const acc = accounts.find(a=>(a.email||'').toLowerCase()===email.toLowerCase());
  if(acc){ enterPanel(email, 'admin', acc.name); }
  else { localStorage.removeItem(ADMIN_CLIENT_KEY); }
}

auth.onAuthStateChanged(async (user)=>{
  if(localStorage.getItem(ADMIN_CLIENT_KEY)) return;   // 一般管理員登入狀態優先
  if(!user){ _currentRole=null; _currentEmail=null; showScreen('login'); return; }
  if((user.email||'').toLowerCase() !== MASTER_EMAIL){
    await auth.signOut();
    showScreen('login');
    const err=document.getElementById('admin-login-err');
    err.style.color='#c62828'; err.textContent='此帳號沒有後台權限';
    return;
  }
  enterPanel(user.email, 'master');
});

// ═══════════════════════════════════════════
//  雲端同步（讀學習者資料）
// ═══════════════════════════════════════════
let _adminUsers = [];   // 雲端讀到的學習者（含真實文件 ID _docId）

async function syncFromCloud(){
  try{
    let usersSnap = await _db.collection('users').get();
    _adminUsers = usersSnap.docs.map(d=>Object.assign({}, d.data(), {_docId:d.id}));
    // 主管理員載入時，自動清掉「無密碼的重複空殼」
    if(_currentRole==='master'){
      const shells=[]; getUserGroups().forEach(g=>g.all.forEach(rec=>{ if(rec!==g.primary && rec._docId && !rec.pw) shells.push(rec._docId); }));
      if(shells.length){
        for(const id of shells){ try{ await _db.collection('users').doc(id).delete(); }catch(e){ console.warn(e); } }
        usersSnap = await _db.collection('users').get();
        _adminUsers = usersSnap.docs.map(d=>Object.assign({}, d.data(), {_docId:d.id}));
      }
    }
    localStorage.setItem(USERS_KEY, JSON.stringify(usersSnap.docs.map(d=>d.data())));
    // 讀考試紀錄；就算這裡失敗也不影響學習者名單顯示
    try{
      const histSnap = await _db.collection('config').doc('examHistory').collection('records').get();
      const hist = histSnap.docs.map(d=>d.data());
      hist.sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(hist));
    }catch(eh){ console.warn('讀取考試紀錄失敗:', eh); }
    renderAdminPanel();
  }catch(e){ console.warn('syncFromCloud:', e); }
}
function getUserAccounts(){ return JSON.parse(localStorage.getItem(USERS_KEY)||'[]'); }

// 把「名稱+Email」相同的多筆合併成一組，保留有密碼的那筆為主
function getUserGroups(){
  const map = new Map();
  for(const u of _adminUsers){
    const key = (u.name||'')+'|'+((u.email||'').toLowerCase());
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(u);
  }
  return [...map.values()].map(g=>({ primary: g.find(x=>x.pw) || g[0], all: g }));
}
function countCleanable(){
  let n=0; getUserGroups().forEach(g=>g.all.forEach(rec=>{ if(rec!==g.primary && rec._docId && !rec.pw) n++; })); return n;
}

function fbSaveUserDoc(rec){
  const data = Object.assign({}, rec); delete data._docId;
  _db.collection('users').doc(rec._docId || rec.name).set(data).catch(e=>console.warn(e));
}
function fbDeleteUserHistory(name){
  _db.collection('config').doc('examHistory').collection('records').where('name','==',name).get().then(s=>s.docs.forEach(d=>d.ref.delete())).catch(e=>console.warn(e));
}

async function hashPw(pw){
  const data = new TextEncoder().encode(pw);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

//  學習者名單
// ═══════════════════════════════════════════
function toggleLearnersTable(){
  const c=document.getElementById('learners-table-container');
  const b=document.getElementById('toggle-learners-btn');
  const hidden = c.style.display==='none';
  c.style.display = hidden ? 'block':'none';
  b.textContent = hidden ? '隱藏':'顯示';
}

function getVisibleGroups(){
  return getUserGroups().filter(g=>!_adminEmails.has((g.primary.email||'').toLowerCase()));
}
function renderAdminPanel(){
  const isMaster = _currentRole==='master';
  const head = document.getElementById('learner-head');
  if(head){
    head.innerHTML = '<th>名稱</th><th>密碼</th><th>Gmail</th><th>考試次數</th><th>最近成績</th>' + (isMaster?'<th>操作</th>':'');
  }
  const groups = getVisibleGroups();
  const history  = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  const tbody = document.getElementById('admin-tbody');
  if(!tbody) return;
  const cols = isMaster ? 6 : 5;
  if(!groups.length){ tbody.innerHTML='<tr><td colspan="'+cols+'" style="text-align:center;color:#999;padding:20px">尚無學習者帳號</td></tr>'; renderAdminsList(); updateCleanupBtn(); return; }
  tbody.innerHTML = groups.map((g,i)=>{
    const acc = g.primary;
    const recs = history.filter(r=>r.name===acc.name);
    const last = recs[0];
    const lastScore = last ? (last.pct+'分（'+last.date+'）') : '—';
    const dupTag = '';
    const actions = isMaster ? ('<td><div class="admin-action-cell">'+
      '<button class="admin-edit-btn" onclick="openEditModal('+i+')">編輯</button>'+
      '<button class="admin-pw-btn" onclick="openResetPwModal('+i+')">重設密碼</button>'+
      '<button class="admin-reset-btn" onclick="resetUserHistory('+i+')">清除記錄</button>'+
      '<button class="admin-delete-btn" onclick="deleteUser('+i+')">刪除</button>'+
      '</div></td>') : '';
    return '<tr><td>'+acc.name+dupTag+'</td>'+
      '<td class="pw-cell"><span style="color:#aaa;font-family:sans-serif;font-size:.8rem">🔒 已加密</span></td>'+
      '<td>'+(acc.email||'—')+'</td>'+
      '<td>'+recs.length+' 次</td>'+
      '<td>'+lastScore+'</td>'+ actions +'</tr>';
  }).join('');
  renderAdminsList();
  updateCleanupBtn();
}

function updateCleanupBtn(){
  const btn = document.getElementById('cleanup-btn');
  if(!btn) return;
  const n = countCleanable();
  if(_currentRole==='master' && n>0){ btn.style.display=''; btn.textContent='🧹 清除空殼（'+n+'）'; }
  else { btn.style.display='none'; }
}

async function cleanupDuplicates(){
  if(_currentRole!=='master') return;
  const toDelete = [];
  getUserGroups().forEach(g=>g.all.forEach(rec=>{ if(rec!==g.primary && rec._docId && !rec.pw) toDelete.push(rec); }));
  if(!toDelete.length){ alert('沒有空殼帳號需要清理'); return; }
  if(!confirm('將刪除 '+toDelete.length+' 筆「無密碼的重複空殼」帳號（每人保留有密碼的那一筆，考試紀錄不受影響）。確定嗎？')) return;
  for(const rec of toDelete){ try{ await _db.collection('users').doc(rec._docId).delete(); }catch(e){ console.warn(e); } }
  alert('✅ 已清除 '+toDelete.length+' 筆空殼帳號');
  syncFromCloud();
}

//  管理員白名單（master 限定）
// ═══════════════════════════════════════════
async function renderAdminsList(){
  if(_currentRole!=='master') return;
  const tbody = document.getElementById('admins-tbody');
  if(!tbody) return;
  let rows = '<tr><td>'+MASTER_EMAIL+'</td><td><span class="role-badge role-master">主管理員</span></td><td style="text-align:center">—</td></tr>';
  try{
    const accounts = await getAdminAccounts();
    accounts.forEach(acc=>{
      const email = (acc.email||'');
      _adminEmails.add(email.toLowerCase());
      if(email.toLowerCase()===MASTER_EMAIL) return;
      const noPw = acc.pw ? '' : ' <span style="color:#c62828;font-size:.72rem">(未設密碼)</span>';
      rows += '<tr><td>'+(acc.name?acc.name+'（'+email+'）':email)+noPw+'</td><td><span class="role-badge role-admin">管理員</span></td>'+
        '<td><div class="admin-action-cell">'+
          '<button class="admin-edit-btn" onclick="openAdminEditModal(\''+email+'\')">編輯</button>'+
          '<button class="admin-pw-btn" onclick="resetAdminPw(\''+email+'\')">重設密碼</button>'+
          '<button class="admin-delete-btn" onclick="deleteAdmin(\''+email+'\')">刪除</button>'+
        '</div></td></tr>';
    });
  }catch(e){ console.warn(e); }
  tbody.innerHTML = rows;
}

let _editAdminOrig = null;   // null=新增, 否則=正在編輯的原 email
function openAdminAddModal(){
  if(_currentRole!=='master') return;
  _editAdminOrig = null;
  document.getElementById('admin-add-title').textContent='新增管理員帳號';
  document.getElementById('newadmin-name').value='';
  document.getElementById('newadmin-email').value='';
  document.getElementById('newadmin-pw').value='';
  document.getElementById('newadmin-pw').placeholder='幫他設定的密碼（至少6碼）';
  const er=document.getElementById('newadmin-error'); if(er) er.textContent='';
  document.getElementById('admin-add-overlay').style.display='flex';
}
async function openAdminEditModal(email){
  if(_currentRole!=='master') return;
  _editAdminOrig = (email||'').toLowerCase();
  const _accs = await getAdminAccounts();
  const _a = _accs.find(a=>(a.email||'').toLowerCase()===_editAdminOrig);
  document.getElementById('admin-add-title').textContent='編輯管理員帳號';
  document.getElementById('newadmin-name').value=(_a && _a.name) || '';
  document.getElementById('newadmin-email').value=email;
  document.getElementById('newadmin-pw').value='';
  document.getElementById('newadmin-pw').placeholder='密碼（留空則不修改）';
  const er=document.getElementById('newadmin-error'); if(er) er.textContent='';
  document.getElementById('admin-add-overlay').style.display='flex';
}
function closeAdminAddModal(){ document.getElementById('admin-add-overlay').style.display='none'; }

async function addAdmin(){   // 彈窗「儲存」：新增或編輯
  if(_currentRole!=='master'){ return; }
  const email=(document.getElementById('newadmin-email').value||'').trim().toLowerCase();
  const pw=document.getElementById('newadmin-pw').value||'';
  const name=(document.getElementById('newadmin-name').value||'').trim();
  const err=document.getElementById('newadmin-error'); err.textContent='';
  if(!email){ err.textContent='請輸入 Email'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Email 格式不正確'; return; }
  if(email===MASTER_EMAIL){ err.textContent='這已經是主管理員'; return; }
  try{
    let accounts = await getAdminAccounts();
    if(_editAdminOrig===null){
      if(accounts.some(a=>(a.email||'').toLowerCase()===email)){ err.textContent='此 Email 已是管理員'; return; }
      if(pw.length<6){ err.textContent='密碼至少 6 碼'; return; }
      accounts.push({email, name, pw: await hashPw(pw)});
    } else {
      const acc = accounts.find(a=>(a.email||'').toLowerCase()===_editAdminOrig);
      if(!acc){ err.textContent='找不到此管理員'; return; }
      if(email!==_editAdminOrig && accounts.some(a=>(a.email||'').toLowerCase()===email)){ err.textContent='此 Email 已被使用'; return; }
      acc.email = email; acc.name = name;
      if(pw){ if(pw.length<6){ err.textContent='密碼至少 6 碼'; return; } acc.pw = await hashPw(pw); }
    }
    await saveAdminAccounts(accounts);
    closeAdminAddModal();
    renderAdminsList();
    alert('✅ 已儲存管理員：'+email + (pw ? ('\n密碼：'+pw+'\n請把帳密給對方。') : ''));
  }catch(e){ err.textContent='儲存失敗：'+(e.code||e.message); }
}

async function resetAdminPw(email){
  if(_currentRole!=='master') return;
  const newPw = prompt('重設「'+email+'」的密碼：\n（請輸入新密碼，至少6碼）');
  if(newPw===null) return;
  if((newPw||'').trim().length<6){ alert('密碼至少 6 碼'); return; }
  try{
    const accounts = await getAdminAccounts();
    const acc = accounts.find(a=>(a.email||'').toLowerCase()===(email||'').toLowerCase());
    if(!acc){ alert('找不到此管理員'); return; }
    acc.pw = await hashPw(newPw);
    await saveAdminAccounts(accounts);
    renderAdminsList();
    alert('✅ 已重設\n管理員：'+email+'\n新密碼：'+newPw+'\n請把新密碼給對方。');
  }catch(e){ alert('重設失敗：'+(e.code||e.message)); }
}

async function deleteAdmin(email){
  if(_currentRole!=='master'){ alert('只有主管理員能刪除'); return; }
  if((email||'').toLowerCase()===MASTER_EMAIL){ alert('無法刪除主管理員'); return; }
  if(!confirm('確定刪除管理員 '+email+' 嗎？刪除後他將無法登入後台。')) return;
  try{
    let accounts = await getAdminAccounts();
    accounts = accounts.filter(a=>(a.email||'').toLowerCase()!==(email||'').toLowerCase());
    await saveAdminAccounts(accounts);
    renderAdminsList();
  }catch(e){ alert('刪除失敗：'+(e.code||e.message)); }
}

// ═══════════════════════════════════════════
//  學習者管理（master 限定）
// ═══════════════════════════════════════════
function deleteUser(gi){
  if(_currentRole!=='master') return;
  const g = getVisibleGroups()[gi]; if(!g) return;
  const name = g.primary.name;
  const email = (g.primary.email||'').toLowerCase();
  if(!confirm('確定刪除帳號「'+name+'」及其所有記錄嗎？')) return;
  g.all.forEach(rec=>{ if(rec._docId) _db.collection('users').doc(rec._docId).delete().catch(e=>console.warn(e)); });
  fbDeleteUserHistory(name);
  const accounts = getUserAccounts().filter(a=>!(a.name===name && (a.email||'').toLowerCase()===email));
  localStorage.setItem(USERS_KEY, JSON.stringify(accounts));
  const history = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').filter(r=>r.name!==name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  syncFromCloud();
}
function resetUserHistory(gi){
  if(_currentRole!=='master') return;
  const g = getVisibleGroups()[gi]; if(!g) return;
  const name = g.primary.name;
  if(!confirm('確定清除「'+name+'」的所有考試記錄嗎？')) return;
  fbDeleteUserHistory(name);
  const history = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').filter(r=>r.name!==name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  syncFromCloud();
}
let _isAdd = false;
let _editGroupIdx = -1;
function openEditModal(gi){
  if(_currentRole!=='master') return;
  const g = getVisibleGroups()[gi]; if(!g) return;
  const acc = g.primary;
  _isAdd = false; _editGroupIdx = gi;
  document.getElementById('modal-title').textContent='編輯帳號';
  document.getElementById('modal-name').value=acc.name||'';
  document.getElementById('modal-pw').value='';
  document.getElementById('modal-email').value=acc.email||'';
  document.getElementById('modal-error').textContent='';
  document.getElementById('admin-modal-overlay').style.display='flex';
}
function openAddModal(){
  if(_currentRole!=='master') return;
  _isAdd = true; _editGroupIdx = -1;
  document.getElementById('modal-title').textContent='新增帳號';
  document.getElementById('modal-name').value='';
  document.getElementById('modal-pw').value='';
  document.getElementById('modal-email').value='';
  document.getElementById('modal-error').textContent='';
  document.getElementById('admin-modal-overlay').style.display='flex';
}
function closeModal(){ document.getElementById('admin-modal-overlay').style.display='none'; }
function openResetPwModal(gi){
  if(_currentRole!=='master') return;
  const g = getVisibleGroups()[gi]; if(!g) return;
  const acc = g.primary;
  const newPw = prompt('重設「'+acc.name+'」的密碼：\n（請輸入新密碼，確認後直接儲存）');
  if(newPw===null) return;
  if(!newPw.trim()){ alert('密碼不可為空白'); return; }
  hashPw(newPw).then(hashed=>{
    g.all.forEach(rec=>{ rec.pw=hashed; fbSaveUserDoc(rec); });
    alert('✅ 已重設\n帳號：'+acc.name+'\n新密碼：'+newPw);
    setTimeout(syncFromCloud, 500);
  });
}
async function saveModal(){
  if(_currentRole!=='master') return;
  const name=document.getElementById('modal-name').value.trim();
  const pw=document.getElementById('modal-pw').value;
  const email=document.getElementById('modal-email').value.trim().toLowerCase();
  const err=document.getElementById('modal-error');
  if(!name){ err.textContent='請輸入名稱'; return; }
  if(_isAdd){
    if(!pw){ err.textContent='請輸入密碼'; return; }
    if(_adminUsers.find(a=>a.name===name)){ err.textContent='此名稱已存在'; return; }
    const rec={name, pw:await hashPw(pw)}; if(email) rec.email=email;
    fbSaveUserDoc(rec);
  } else {
    const g=getUserGroups()[_editGroupIdx]; if(!g){ err.textContent='帳號不存在'; return; }
    const rec=g.primary;
    if(name!==rec.name && _adminUsers.find(a=>a.name===name && a!==rec)){ err.textContent='此名稱已被使用'; return; }
    rec.name=name; if(pw) rec.pw=await hashPw(pw); if(email) rec.email=email;
    fbSaveUserDoc(rec);
  }
  closeModal();
  setTimeout(syncFromCloud, 500);
}
