<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者後臺 - 對外華語教學認證模擬考</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Serif TC','Microsoft JhengHei',serif; background:#f5f0e8; color:#2c2c2c; min-height:100vh; }
main { max-width:880px; margin:0 auto; padding:28px 16px; }

#admin-screen { display:none; padding:20px 0; }
.admin-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.admin-title { font-size:1.2rem; font-weight:700; flex:1; }
.admin-back { background:#f5f5f5; border:1px solid #ddd; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:.9rem; }
.admin-back:hover { background:#e8e8e8; }
.admin-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.admin-table th { background:#4a90d9; color:#fff; padding:10px 14px; text-align:left; font-size:.85rem; }
.admin-table td { padding:10px 14px; font-size:.85rem; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
.admin-table tr:last-child td { border-bottom:none; }
.admin-table tr:hover td { background:#f8f9ff; }
.pw-cell { font-family:monospace; color:#555; }
.admin-section { font-size:.78rem; color:#888; margin-bottom:12px; }
.admin-add-btn { background:linear-gradient(135deg,#4a90d9,#357abd); color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:.88rem; font-weight:600; cursor:pointer; margin-bottom:16px; }
.admin-add-btn:hover { opacity:.88; }
.admin-action-cell { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.admin-edit-btn { background:#357abd; color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:.8rem; cursor:pointer; font-weight:600; transition:background .2s; }
.admin-edit-btn:hover { background:#1a5fa8; }
.admin-pw-btn { background:#9c27b0; color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:.8rem; cursor:pointer; font-weight:600; transition:background .2s; }
.admin-pw-btn:hover { background:#7b1fa2; }
.admin-reset-btn { background:#ff9800; color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:.8rem; cursor:pointer; font-weight:600; transition:background .2s; }
.admin-reset-btn:hover { background:#f57c00; }
.admin-delete-btn { background:#c62828; color:#fff; border:none; border-radius:6px; padding:6px 12px; font-size:.8rem; cursor:pointer; font-weight:600; transition:background .2s; }
.admin-delete-btn:hover { background:#ad1457; }

/* Modal */
#admin-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
.admin-modal { background:#fff; border-radius:16px; padding:28px 24px; width:320px; max-width:90vw; }
.admin-modal h3 { margin:0 0 20px; font-size:1.05rem; }
.admin-modal label { display:block; font-size:.82rem; color:#666; margin-bottom:4px; margin-top:12px; }
.admin-modal input { width:100%; box-sizing:border-box; padding:10px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:.95rem; outline:none; }
.admin-modal input:focus { border-color:#4a90d9; }
.modal-error { color:#c62828; font-size:.8rem; margin-top:8px; min-height:16px; }
.modal-btns { display:flex; gap:10px; justify-content:space-between; margin-top:20px; }
.modal-btn-primary { background:#4a90d9; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:.88rem; cursor:pointer; font-weight:600; flex:1; }
.modal-btn-primary:hover { background:#357abd; }
.modal-btn-cancel { background:#e0e0e0; color:#333; border:none; border-radius:8px; padding:10px 20px; font-size:.88rem; cursor:pointer; font-weight:600; flex:1; }
.modal-btn-cancel:hover { background:#d0d0d0; }

/* Login screen */
#admin-login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; }
.admin-login-box { background:#fff; border-radius:16px; padding:32px 28px; width:300px; max-width:90vw; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.1); }
.admin-login-box h3 { margin:0 0 6px; font-size:1.3rem; }
.admin-login-box p { color:#888; font-size:.85rem; margin:0 0 20px; }
.admin-login-box input { width:100%; box-sizing:border-box; padding:10px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:.95rem; margin-bottom:12px; outline:none; }
.admin-login-box input:focus { border-color:#4a90d9; }
.login-error { color:#c62828; font-size:.85rem; margin:8px 0; min-height:18px; }
.login-btn { width:100%; padding:12px; background:linear-gradient(135deg,#4a90d9,#357abd); color:#fff; border:none; border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; margin-bottom:12px; }
.login-btn:hover { opacity:.88; }

@media(max-width:520px){
  main { padding:16px; }
  .admin-modal { width:90%; }
  .admin-login-box { width:90%; }
  .admin-table { font-size:.75rem; }
  .admin-table th, .admin-table td { padding:6px 8px; }
}
</style>
<!-- Firebase（雲端同步，與主程式同一個專案） -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="admin-login-screen">
  <div class="admin-login-box">
    <h3>🔐 管理者後臺</h3>
    <p>用 Google 郵箱登入</p>
    <input type="email" id="admin-email-input" placeholder="Gmail 郵箱（例：admin@gmail.com）"
      onkeydown="if(event.key==='Enter')adminGoogleLogin()">
    <div class="login-error" id="admin-login-err"></div>
    <button class="login-btn" onclick="adminGoogleLogin()" style="margin-bottom:12px">🔐 用 Google 郵箱登入</button>
    <div style="border-top:1px solid #e0e0e0;padding-top:12px;margin-top:12px">
      <p style="font-size:.75rem;color:#999;margin-bottom:8px">備用密碼登入</p>
      <input type="password" id="admin-pw-input" placeholder="管理者密碼"
        onkeydown="if(event.key==='Enter')adminLogin()" style="margin-bottom:8px">
      <button class="login-btn" onclick="adminLogin()" style="background:#f5f5f5;color:#555;border:1px solid #ddd;margin-bottom:0">用密碼登入</button>
    </div>
  </div>
</div>

<main>
  <div id="admin-screen" style="display:none">
    <div class="admin-header">
      <button class="admin-back" onclick="closeAdminPanel()">← 登出</button>
      <span class="admin-title">⚙️ 管理者後臺</span>
      <button class="admin-add-btn" onclick="openAddModal()">＋ 新增帳號</button>
    </div>

    <!-- 學習者帳號管理 -->
    <div class="admin-header" style="margin-bottom:16px">
      <span class="admin-title">📚 學習者名單</span>
      <button id="toggle-learners-btn" class="admin-back" onclick="toggleLearnersTable()" style="background:#4a90e2;color:#fff;border:none;cursor:pointer;padding:8px 16px;border-radius:8px">隱藏</button>
    </div>
    <div id="learners-table-container" style="overflow-x:auto;margin-bottom:30px">
    <table class="admin-table">
      <thead><tr>
        <th>名稱</th><th>密碼</th><th>Gmail</th><th>考試次數</th><th>最近成績</th><th>操作</th>
      </tr></thead>
      <tbody id="admin-tbody"></tbody>
    </table>
    </div>

    <!-- 管理員白名單管理 -->
    <div style="border-top:2px solid #e0e0e0;padding-top:20px">
      <div class="admin-header" style="margin-bottom:16px">
        <span class="admin-title">👤 管理員存取權限</span>
      </div>
      <div class="admin-section">設定哪些 Google 郵箱可以登入後臺</div>

      <!-- 新增管理員 -->
      <div style="background:#f5f5f5;border-radius:8px;padding:12px;margin-bottom:16px">
        <div style="display:flex;gap:8px;align-items:center">
          <input type="email" id="admin-email-add" placeholder="輸入 Gmail 郵箱（如 admin@gmail.com）"
            style="flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:.9rem">
          <button class="admin-add-btn" onclick="addAdminEmail()" style="margin:0;padding:8px 16px">＋ 新增</button>
        </div>
      </div>

      <!-- 白名單表格 -->
      <div style="overflow-x:auto">
      <table class="admin-table">
        <thead><tr>
          <th>Google 郵箱</th><th style="text-align:center">操作</th>
        </tr></thead>
        <tbody id="admin-whitelist-tbody"></tbody>
      </table>
      </div>
    </div>
  </div>
</main>

<!-- Admin Modal -->
<div id="admin-modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center">
  <div class="admin-modal">
    <h3 id="modal-title">編輯帳號</h3>
    <input type="hidden" id="modal-idx">
    <label>名稱</label>
    <input type="text" id="modal-name" placeholder="帳號名稱" maxlength="20">
    <label>密碼（留空則不修改）</label>
    <input type="password" id="modal-pw" placeholder="新密碼（留空不改）">
    <label>Gmail（忘記密碼使用）</label>
    <input type="email" id="modal-email" placeholder="Gmail 信箱">
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-btns">
      <button class="modal-btn-primary" onclick="saveModal()">儲存</button>
      <button class="modal-btn-cancel"  onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════
const USERS_KEY = 'tocfl_users';
const ADMIN_SESSION_KEY = 'tocfl_admin_session';
const ADMIN_KEY = 'tocfl_admin_pw';
const ADMINS_KEY = 'tocfl_admins';
const STORAGE_KEY = 'tocfl_exam_history';

// ═══════════════════════════════════════════
//  FIREBASE 雲端同步（與主程式 華語教學認證模擬考.html 一致）
// ═══════════════════════════════════════════
const FB_CONFIG = {
  apiKey: "AIzaSyCSgZ9DmLuKIqqbxrVgAcUfy-QJFhzjjp8",
  authDomain: "qna-chinese.firebaseapp.com",
  projectId: "qna-chinese",
  storageBucket: "qna-chinese.firebasestorage.app",
  messagingSenderId: "645044163415",
  appId: "1:645044163415:web:c33d1a22422de3083b6412"
};
let _db = null;
function initFirebase(){
  try {
    if(typeof firebase === 'undefined') return;
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    _db = firebase.firestore();
    syncFromCloud();
  } catch(e){ console.warn('Firebase unavailable:', e); }
}
async function syncFromCloud(){
  if(!_db) return;
  try {
    const usersSnap = await _db.collection('users').get();
    if(!usersSnap.empty){
      localStorage.setItem(USERS_KEY, JSON.stringify(usersSnap.docs.map(d=>d.data())));
    }
    const histSnap = await _db.collection('examHistory').get();
    if(!histSnap.empty){
      const hist = histSnap.docs.map(d=>d.data());
      hist.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(hist));
    }
    const adminSnap = await _db.collection('config').doc('admin').get();
    if(adminSnap.exists && adminSnap.data().pw){
      localStorage.setItem(ADMIN_KEY, adminSnap.data().pw);
    }
    const scr = document.getElementById('admin-screen');
    if(scr && scr.style.display !== 'none') renderAdminPanel();
  } catch(e){ console.warn('Cloud sync failed:', e); }
}
function fbSaveUsers(accounts){
  if(!_db) return;
  accounts.forEach(acc=>{ _db.collection('users').doc(acc.name).set(acc).catch(e=>console.warn('fbSaveUsers:', e)); });
}
function fbDeleteUser(name){
  if(!_db) return;
  _db.collection('users').doc(name).delete().catch(e=>console.warn('fbDeleteUser:', e));
}
function fbDeleteUserHistory(name){
  if(!_db) return;
  _db.collection('examHistory').where('name','==',name).get().then(snap=>{
    snap.docs.forEach(d=>d.ref.delete());
  }).catch(e=>console.warn('fbDeleteUserHistory:', e));
}

// ═══════════════════════════════════════════
//  HELPER FUNCTIONS
// ═══════════════════════════════════════════
function getUserAccounts(){
  return JSON.parse(localStorage.getItem(USERS_KEY)||'[]');
}

function getAdminWhitelist(){
  const list = localStorage.getItem(ADMINS_KEY);
  return list ? JSON.parse(list) : ['qnachinese@gmail.com'];
}

function isAdminEmail(email){
  return getAdminWhitelist().includes(email.toLowerCase());
}

async function hashPw(pw){
  const encoder = new TextEncoder();
  const data = encoder.encode(pw);
  const hash = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hash));
  return hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
}

function isHashed(pw){
  return pw && pw.length === 64 && /^[0-9a-f]{64}$/.test(pw);
}

// ═══════════════════════════════════════════
//  ADMIN LOGIN
// ═══════════════════════════════════════════
async function adminGoogleLogin(){
  const email = document.getElementById('admin-email-input')?.value?.trim().toLowerCase() || '';
  const errEl = document.getElementById('admin-login-err');

  if(!email){ errEl.textContent='請輸入 Gmail 郵箱'; return; }
  if(!email.endsWith('@gmail.com') && !email.endsWith('@google.com')){
    errEl.textContent='請輸入有效的 Google 郵箱'; return;
  }

  // 檢查白名單
  if(!isAdminEmail(email)){
    errEl.textContent='此郵箱無後臺存取權限'; return;
  }

  // 設定管理員 session
  localStorage.setItem(ADMIN_SESSION_KEY, email);
  document.getElementById('admin-login-screen').style.display='none';
  document.getElementById('admin-screen').style.display='block';
  renderAdminPanel();
  syncFromCloud();
}

async function adminLogin(){
  const pw = document.getElementById('admin-pw-input')?.value;
  const errEl = document.getElementById('admin-login-err');
  const stored = localStorage.getItem(ADMIN_KEY);
  if(!stored){
    // First-time setup: set password
    if(!pw){ errEl.textContent='請設定管理者密碼'; return; }
    const hashed = await hashPw(pw);
    localStorage.setItem(ADMIN_KEY, hashed);
    if(_db) _db.collection('config').doc('admin').set({pw:hashed}).catch(e=>console.warn('save admin pw:', e));
    document.getElementById('admin-login-screen').style.display='none';
    document.getElementById('admin-screen').style.display='block';
    renderAdminPanel();
    syncFromCloud();
    return;
  }
  if(!pw){ errEl.textContent='請輸入密碼'; return; }
  const match = isHashed(stored) ? (stored === await hashPw(pw)) : (stored === pw);
  if(!match){ errEl.textContent='密碼錯誤'; return; }
  document.getElementById('admin-login-screen').style.display='none';
  document.getElementById('admin-screen').style.display='block';
  renderAdminPanel();
  syncFromCloud();
}

function closeAdminPanel(){
  localStorage.removeItem(ADMIN_SESSION_KEY);
  document.getElementById('admin-screen').style.display='none';
  document.getElementById('admin-login-screen').style.display='flex';
  document.getElementById('admin-email-input').value='';
  document.getElementById('admin-pw-input').value='';
  document.getElementById('admin-login-err').textContent='';
}

// ═══════════════════════════════════════════
//  ADMIN PANEL RENDERING
// ═══════════════════════════════════════════
function toggleLearnersTable(){
  const container = document.getElementById('learners-table-container');
  const btn = document.getElementById('toggle-learners-btn');
  const isHidden = container.style.display === 'none';
  container.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '隱藏' : '顯示';
}

function renderAdminPanel(){
  const accounts = getUserAccounts();
  const history  = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  const tbody = document.getElementById('admin-tbody');
  if(!tbody) return;
  if(!accounts.length){
    tbody.innerHTML='<tr><td colspan="6" style="text-align:center;color:#999;padding:20px">尚無學習者帳號</td></tr>';
    renderAdminWhitelist();
    return;
  }
  tbody.innerHTML = accounts.map((acc,i)=>{
    const recs = history.filter(r=>r.name===acc.name);
    const last = recs[0];
    const lastScore = last ? `${last.pct}分（${last.date}）` : '—';
    return `<tr>
      <td>${acc.name}</td>
      <td class="pw-cell"><span style="color:#aaa;font-family:sans-serif;font-size:.8rem">🔒 已加密</span></td>
      <td>${acc.email||'—'}</td>
      <td>${recs.length} 次</td>
      <td>${lastScore}</td>
      <td>
        <div class="admin-action-cell">
          <button class="admin-edit-btn" onclick="openEditModal(${i})">編輯</button>
          <button class="admin-pw-btn" onclick="openResetPwModal('${acc.name}')">重設密碼</button>
          <button class="admin-reset-btn" onclick="resetUserHistory('${acc.name}')">清除記錄</button>
          <button class="admin-delete-btn" onclick="deleteUser('${acc.name}')">刪除</button>
        </div>
      </td>
    </tr>`;
  }).join('');

  // 渲染管理員白名單
  renderAdminWhitelist();
}

function renderAdminWhitelist(){
  const tbody = document.getElementById('admin-whitelist-tbody');
  if(!tbody) return;
  const whitelist = getAdminWhitelist();
  tbody.innerHTML = whitelist.map((email,i)=>{
    return `<tr>
      <td>${email}</td>
      <td style="text-align:center"><button class="admin-delete-btn" onclick="removeAdminEmail('${email}')">移除</button></td>
    </tr>`;
  }).join('');
}

// ═══════════════════════════════════════════
//  ADMIN EMAIL MANAGEMENT
// ═══════════════════════════════════════════
function addAdminEmail(){
  const input = document.getElementById('admin-email-add');
  if(!input) return;
  const email = input.value.trim().toLowerCase();

  if(!email){ alert('請輸入郵箱'); return; }
  if(!email.endsWith('@gmail.com') && !email.endsWith('@google.com')){ alert('請輸入有效的 Google 郵箱'); return; }

  const whitelist = getAdminWhitelist();
  if(whitelist.includes(email)){ alert('此郵箱已在白名單中'); return; }

  whitelist.push(email);
  localStorage.setItem(ADMINS_KEY, JSON.stringify(whitelist));
  input.value='';
  renderAdminWhitelist();
}

function removeAdminEmail(email){
  const whitelist = getAdminWhitelist();
  const isMaster = email === 'qnachinese@gmail.com';
  if(isMaster){ alert('無法移除主管理員帳號'); return; }
  if(!confirm(`確定要移除 ${email} 的管理權限嗎？`)) return;
  let list = whitelist.filter(e=>e!==email);
  localStorage.setItem(ADMINS_KEY, JSON.stringify(list));
  renderAdminWhitelist();
}

// ═══════════════════════════════════════════
//  LEARNER ACCOUNT MANAGEMENT
// ═══════════════════════════════════════════
function deleteUser(name){
  if(!confirm(`確定要刪除帳號「${name}」及其所有記錄嗎？`)) return;
  let accounts = getUserAccounts().filter(a=>a.name!==name);
  localStorage.setItem(USERS_KEY, JSON.stringify(accounts));
  let history = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').filter(r=>r.name!==name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  fbDeleteUser(name);
  fbDeleteUserHistory(name);
  renderAdminPanel();
}

function resetUserHistory(name){
  if(!confirm(`確定要清除「${name}」的所有考試記錄嗎？`)) return;
  let history = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').filter(r=>r.name!==name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  fbDeleteUserHistory(name);
  renderAdminPanel();
}

// ═══════════════════════════════════════════
//  MODAL MANAGEMENT
// ═══════════════════════════════════════════
let _editIdx = -1;

function openEditModal(idx){
  const accounts = getUserAccounts();
  const acc = accounts[idx];
  if(!acc) return;
  _editIdx = idx;
  document.getElementById('modal-title').textContent='編輯帳號';
  document.getElementById('modal-name').value = acc.name;
  document.getElementById('modal-pw').value = '';
  document.getElementById('modal-email').value = acc.email||'';
  document.getElementById('modal-idx').value = idx;
  document.getElementById('modal-error').textContent='';
  document.getElementById('admin-modal-overlay').style.display='flex';
}

function openAddModal(){
  _editIdx = -1;
  document.getElementById('modal-title').textContent='新增帳號';
  document.getElementById('modal-name').value='';
  document.getElementById('modal-pw').value='';
  document.getElementById('modal-email').value='';
  document.getElementById('modal-idx').value='';
  document.getElementById('modal-error').textContent='';
  document.getElementById('admin-modal-overlay').style.display='flex';
}

function closeModal(){
  document.getElementById('admin-modal-overlay').style.display='none';
}

function openResetPwModal(name){
  const newPw = prompt(`重設「${name}」的密碼：\n（請輸入新密碼，確認後會直接儲存）`);
  if(newPw === null) return;
  if(!newPw.trim()){ alert('密碼不可為空白'); return; }
  hashPw(newPw).then(hashed=>{
    let accounts = getUserAccounts();
    const acc = accounts.find(a=>a.name===name);
    if(!acc){ alert('帳號不存在'); return; }
    acc.pw = hashed;
    localStorage.setItem(USERS_KEY, JSON.stringify(accounts));
    fbSaveUsers(accounts);
    renderAdminPanel();
    const msg = document.createElement('div');
    msg.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#4a148c;color:#fff;padding:14px 22px;border-radius:10px;z-index:9999;font-size:.95rem;box-shadow:0 4px 20px rgba(0,0,0,.3);text-align:center;max-width:320px';
    msg.innerHTML=`<div style="margin-bottom:6px;font-size:.85rem;opacity:.85">✅ 密碼已重設</div><div style="font-size:1.1rem;font-weight:700;letter-spacing:.05em">帳號：${name}</div><div style="font-size:1.1rem;font-weight:700;letter-spacing:.05em">密碼：${newPw}</div><div style="font-size:.75rem;opacity:.7;margin-top:6px">（5秒後自動關閉）</div>`;
    document.body.appendChild(msg);
    setTimeout(()=>msg.remove(), 5000);
  });
}

async function saveModal(){
  const name  = document.getElementById('modal-name').value.trim();
  const pw    = document.getElementById('modal-pw').value;
  const email = document.getElementById('modal-email').value.trim().toLowerCase();
  const errEl = document.getElementById('modal-error');
  if(!name){ errEl.textContent='請輸入名稱'; return; }
  let accounts = getUserAccounts();
  if(_editIdx < 0){
    // Add new
    if(!pw){ errEl.textContent='請輸入密碼'; return; }
    if(accounts.find(a=>a.name===name)){ errEl.textContent='此名稱已存在'; return; }
    const newAcc = {name, pw: await hashPw(pw)};
    if(email) newAcc.email = email;
    accounts.push(newAcc);
  } else {
    // Edit existing
    const acc = accounts[_editIdx];
    if(!acc){ errEl.textContent='帳號不存在'; return; }
    if(name !== acc.name && accounts.find(a=>a.name===name)){ errEl.textContent='此名稱已被使用'; return; }
    acc.name = name;
    if(pw) acc.pw = await hashPw(pw);
    if(email !== undefined) acc.email = email || acc.email;
  }
  localStorage.setItem(USERS_KEY, JSON.stringify(accounts));
  fbSaveUsers(accounts);
  closeModal();
  renderAdminPanel();
}

window.addEventListener('load', ()=>{
  initFirebase();
  // Check if already logged in
  const session = localStorage.getItem(ADMIN_SESSION_KEY);
  if(session){
    document.getElementById('admin-login-screen').style.display='none';
    document.getElementById('admin-screen').style.display='block';
    renderAdminPanel();
  }
});

</script>
