<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者後臺 - 對外華語教學認證模擬考</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Serif TC','Microsoft JhengHei',serif; background:#f5f0e8; color:#2c2c2c; min-height:100vh; }
main { max-width:880px; margin:0 auto; padding:28px 16px; }

#admin-screen { display:none; padding:20px 0; }
.admin-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.admin-title { font-size:1.2rem; font-weight:700; flex:1; }
.admin-back { background:#f5f5f5; border:1px solid #ddd; border-radius:8px; padding:8px 16px; cursor:pointer; font-size:.9rem; }
.admin-back:hover { background:#e8e8e8; }
.role-badge { font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px; }
.role-master { background:#fff3e0; color:#e65100; border:1px solid #ffcc80; }
.role-admin  { background:#e3f2fd; color:#1565c0; border:1px solid #90caf9; }
.admin-table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.admin-table th { background:#4a90d9; color:#fff; padding:10px 14px; text-align:left; font-size:.85rem; }
.admin-table td { padding:10px 14px; font-size:.85rem; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
.admin-table tr:last-child td { border-bottom:none; }
.admin-table tr:hover td { background:#f8f9ff; }
.pw-cell { font-family:monospace; color:#555; white-space:nowrap; }
.admin-section { font-size:.78rem; color:#888; margin-bottom:12px; }
/* 區塊標題列：標題 + 說明 + 右側按鈕（三個名單區塊用同一格式） */
.sec { border-top:2px solid #e0e0e0; padding-top:22px; margin-top:26px; }
.sec-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.sec-head .admin-title { flex:1; }
.sec-desc { font-size:.8rem; color:#888; margin:0 0 12px; min-height:1.2em; }
.sec-btn { height:36px; padding:0 16px; border-radius:8px; font-size:.88rem; font-weight:600; cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; border:1.5px solid transparent; margin:0; }
.sec-btn.primary { background:linear-gradient(135deg,#4a90d9,#357abd); color:#fff; }
.sec-btn.primary:hover { opacity:.9; }
.sec-btn.ghost { background:#fff; color:#357abd; border-color:#bcd3ec; min-width:64px; }
.sec-btn.ghost:hover { background:#eef5fc; }
.sec-btn.warn { background:#ff7043; color:#fff; }
.sec-table { overflow-x:auto; }
/* 收合按鈕：只用箭頭圖示（展開時朝上、收起時朝下） */
.sec-btn.icon { width:36px; min-width:36px; padding:0; }
.sec-btn.icon svg { width:18px; height:18px; display:block; transition:transform .2s; }
.sec-btn.icon.collapsed svg { transform:rotate(180deg); }
.admin-add-btn { background:linear-gradient(135deg,#4a90d9,#357abd); color:#fff; border:none; border-radius:8px; padding:8px 18px; font-size:.88rem; font-weight:600; cursor:pointer; margin-bottom:16px; }
.admin-add-btn:hover { opacity:.88; }
.admin-action-cell { display:flex; gap:6px; flex-wrap:nowrap; align-items:center; white-space:nowrap; }
.admin-edit-btn { background:#357abd; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-edit-btn:hover { background:#1a5fa8; }
.admin-pw-btn { background:#9c27b0; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-pw-btn:hover { background:#7b1fa2; }
.admin-reset-btn { background:#ff9800; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-reset-btn:hover { background:#f57c00; }
.admin-delete-btn { background:#c62828; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:.76rem; cursor:pointer; font-weight:600; white-space:nowrap; transition:background .2s; }
.admin-delete-btn:hover { background:#ad1457; }

/* Modal */
#admin-modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center; }
.admin-modal { background:#fff; border-radius:16px; padding:28px 24px; width:320px; max-width:90vw; }
.admin-modal h3 { margin:0 0 20px; font-size:1.05rem; }
/* ── 儀表板 ── */
.dash-cards { display:flex; flex-wrap:wrap; gap:12px; }
.dash-card { flex:1 1 130px; min-width:130px; background:#fff; border:1px solid #e8e8ee; border-radius:12px; padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.dash-val { font-size:1.5rem; font-weight:800; color:#2c3e50; line-height:1.1; word-break:break-word; }
.dash-label { font-size:.8rem; color:#888; margin-top:4px; }
.dash-sub { font-size:.72rem; color:#aaa; margin-top:2px; }
.dash-bars { margin-top:14px; background:#fff; border:1px solid #e8e8ee; border-radius:12px; padding:14px 16px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.dash-bar-row { display:flex; align-items:center; gap:10px; margin:7px 0; font-size:.82rem; }
.dash-bar-name { flex:0 0 130px; color:#444; }
.dash-bar { flex:1; height:12px; background:#eee; border-radius:6px; overflow:hidden; }
.dash-bar-fill { height:100%; border-radius:6px; }
.dash-bar-pct { flex:0 0 42px; text-align:right; font-weight:700; }
.dash-bar-cnt { flex:0 0 66px; text-align:right; color:#999; font-size:.75rem; }
/* ── 學生詳情 ── */
.stu-link { background:none; border:none; color:#2c6fb0; font:inherit; font-weight:600; cursor:pointer; padding:0; text-decoration:underline; }
.stu-link:hover { color:#1a4a80; }
.stu-modal { background:#fff; border-radius:16px; padding:24px; width:640px; max-width:94vw; max-height:90vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,.25); }
.stu-sec-title { font-size:.9rem; font-weight:700; color:#8b1a1a; margin:20px 0 8px; }
.stu-pills { display:flex; flex-wrap:wrap; gap:6px; }
.stu-pill { font-size:.75rem; padding:3px 9px; border-radius:20px; color:#fff; font-weight:700; }
.stu-rec-table { width:100%; border-collapse:collapse; font-size:.8rem; }
.stu-rec-table th { background:#f2f4f8; color:#555; padding:7px 10px; text-align:left; font-weight:600; }
.stu-rec-table td { padding:7px 10px; border-bottom:1px solid #f0f0f0; }
.stu-wrong-item { font-size:.82rem; padding:7px 0; border-bottom:1px dashed #eee; line-height:1.5; }
.stu-wrong-tag { display:inline-block; background:#fdecea; color:#c0392b; font-size:.7rem; padding:1px 7px; border-radius:6px; margin-right:6px; white-space:nowrap; }
.admin-modal label { display:block; font-size:.82rem; color:#666; margin-bottom:4px; margin-top:12px; }
.admin-modal input { width:100%; box-sizing:border-box; padding:10px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:.95rem; outline:none; }
.admin-modal input:focus { border-color:#4a90d9; }
.modal-error { color:#c62828; font-size:.8rem; margin-top:8px; min-height:16px; }
.modal-btns { display:flex; gap:10px; justify-content:space-between; margin-top:20px; }
.modal-btn-primary { background:#4a90d9; color:#fff; border:none; border-radius:8px; padding:10px 20px; font-size:.88rem; cursor:pointer; font-weight:600; flex:1; }
.modal-btn-primary:hover { background:#357abd; }
.modal-btn-cancel { background:#e0e0e0; color:#333; border:none; border-radius:8px; padding:10px 20px; font-size:.88rem; cursor:pointer; font-weight:600; flex:1; }
.modal-btn-cancel:hover { background:#d0d0d0; }

/* Login screen */
#admin-login-screen { display:none; align-items:center; justify-content:center; min-height:100vh; }
.admin-login-box { background:#fff; border-radius:16px; padding:32px 28px; width:320px; max-width:90vw; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.1); }
.admin-login-box h3 { margin:0 0 4px; font-size:1.3rem; }
.admin-login-box p { color:#888; font-size:.85rem; margin:0 0 20px; }
.admin-login-box input { width:100%; box-sizing:border-box; padding:11px 12px; border:2px solid #e0e0e0; border-radius:8px; font-size:.95rem; margin-bottom:12px; outline:none; }
.admin-login-box input:focus { border-color:#4a90d9; }
.login-error { color:#c62828; font-size:.85rem; margin:6px 0; min-height:18px; }
.login-msg-ok { color:#2e7d32; font-size:.85rem; margin:6px 0; min-height:18px; }
.login-btn { width:100%; padding:12px; background:linear-gradient(135deg,#4a90d9,#357abd); color:#fff; border:none; border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; margin-bottom:10px; }
.login-btn:hover { opacity:.88; }
.link-btn { background:none; border:none; color:#4a90d9; font-size:.82rem; cursor:pointer; text-decoration:underline; }
#admin-forgot-box { display:none; margin-top:14px; background:#fff8e1; border:1px solid #ffe082; border-radius:8px; padding:14px; text-align:left; }
#admin-forgot-box p { font-size:.8rem; color:#5d4037; margin:0 0 8px; }
#boot-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; color:#888; font-size:.95rem; }

@media(max-width:520px){
  main { padding:16px; }
  .admin-modal { width:90%; }
  .admin-login-box { width:90%; }
  .admin-table { font-size:.75rem; }
  .admin-table th, .admin-table td { padding:6px 8px; }
}
.qb-ctrl { padding:8px 10px; border:1px solid #ccc; border-radius:8px; font-size:.85rem; background:#fff; }
.qb-edit-link { background:#4a90d9; color:#fff; border:none; border-radius:6px; padding:4px 12px; cursor:pointer; font-size:.8rem; }
.qb-edit-link:hover { opacity:.88; }
.qb-modal { background:#fff; border-radius:16px; padding:24px; width:780px; max-width:94vw; max-height:90vh; overflow-y:auto; text-align:left; }
.qb-modal h3 { margin:0 0 16px; font-size:1.05rem; }
.qb-modal label { display:block; font-size:.82rem; color:#555; margin:12px 0 4px; font-weight:600; }
.qb-modal input, .qb-modal textarea, .qb-modal select { width:100%; box-sizing:border-box; padding:9px 11px; border:2px solid #e0e0e0; border-radius:8px; font-size:.9rem; outline:none; font-family:inherit; }
.qb-modal textarea { resize:vertical; line-height:1.7; }
.qb-modal input:focus, .qb-modal textarea:focus, .qb-modal select:focus { border-color:#4a90d9; }

/* ════════ 後台 v3 版面：上方分頁、深紅主色、線條圖示 ════════ */
:root { --brand:#8b1a1a; --brand-h:#a32222; --brand-soft:#fbf1ef; --ink:#2c2c2c; --muted:#8a8178; --line:#ece4d6; --card:#fff; --page:#f5f0e8; }
body { font-family:'Noto Serif TC','Microsoft JhengHei',serif; background:var(--page); color:var(--ink); }
main { max-width:1080px; padding:0 16px 40px; }
#admin-screen { padding:0; }
.ico { width:18px; height:18px; flex:0 0 auto; display:block; }
/* 頂端列 */
.topbar { position:sticky; top:0; z-index:50; background:var(--page); padding:14px 0 0; }
.topbar-row { display:flex; align-items:center; gap:10px; padding:4px 0 12px; }
.brand { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.brand-mark { width:32px; height:32px; border-radius:9px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-family:"Noto Serif TC",serif; font-weight:700; font-size:15px; }
.brand-name { font-size:16px; font-weight:700; white-space:nowrap; }
.env-tag { font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; white-space:nowrap; }
.env-tag.staging { background:#fdf0d6; color:#8a5a00; }
.env-tag.prod { background:#e6f2e8; color:#2e6b38; }
.who { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); min-width:0; }
.who #who-am-i { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
.role-badge { font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; border:none; white-space:nowrap; }
.role-master { background:var(--brand-soft); color:var(--brand); border:none; }
.role-admin { background:#e9f0f8; color:#2b5a8a; border:none; }
.icon-btn { width:36px; height:36px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
.icon-btn:hover { color:var(--brand); border-color:#d9c7b8; }
/* 分頁列 */
.tabs { display:flex; gap:4px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { display:flex; align-items:center; gap:7px; padding:10px 14px 11px; border:none; background:none; font:inherit; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.tab:hover { color:var(--ink); }
.tab.active { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
/* 每一頁 */
.page { display:none; padding-top:22px; }
.page.active { display:block; }
.page-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; min-height:36px; }
.page-head-text { flex:1; min-width:0; }
.page-title { font-size:20px; font-weight:700; margin:0; }
.page-desc { font-size:13px; color:var(--muted); line-height:1.6; }
.page-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
/* 按鈕 */
.btn { height:36px; padding:0 14px; border-radius:9px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; border:1px solid transparent; }
.btn .ico { width:16px; height:16px; }
.btn-primary { background:var(--brand); color:#fff; }
.btn-primary:hover { background:var(--brand-h); }
.btn-secondary { background:#fff; color:var(--ink); border-color:var(--line); }
.btn-secondary:hover { border-color:#d9c7b8; background:#fffdf9; }
.btn-danger { background:#fff; color:#b3261e; border-color:#f0cfcb; }
.btn-danger:hover { background:#fdf1f0; }
.chip-note { font-size:13px; color:var(--muted); white-space:nowrap; }
/* 卡片與表格 */
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; }
.sec-table { overflow-x:auto; }
.admin-table { width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:none; }
.admin-table th { background:#faf6ef; color:var(--muted); font-weight:600; font-size:13px; padding:11px 16px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
.admin-table td { padding:12px 16px; font-size:14px; border-bottom:1px solid #f3eee5; vertical-align:middle; }
.admin-table tr:last-child td { border-bottom:none; }
.admin-table tr:hover td { background:#fdfaf5; }
.admin-table td.actions { width:56px; text-align:right; }
.stu-link { color:var(--ink); font-weight:600; text-decoration:none; border-bottom:1px dashed #cdbfae; }
.stu-link:hover { color:var(--brand); border-bottom-color:var(--brand); }
.chip { display:inline-block; font-size:12px; font-weight:600; padding:3px 9px; border-radius:6px; white-space:nowrap; }
.chip.ok { background:#e6f2e8; color:#2e6b38; }
.chip.wait { background:#fdf0d6; color:#8a5a00; }
.chip.info { background:#e9f0f8; color:#2b5a8a; }
.empty-row { text-align:center; color:var(--muted); padding:28px 16px !important; }
/* ⋯ 選單 */
.dots-btn { width:32px; height:32px; border-radius:8px; border:none; background:none; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
.dots-btn:hover { background:#f4efe6; color:var(--ink); }
.row-menu { position:fixed; z-index:2000; min-width:170px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(60,30,20,.16); padding:6px; }
.row-menu button { display:flex; width:100%; align-items:center; gap:8px; padding:9px 10px; border:none; background:none; border-radius:8px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; text-align:left; white-space:nowrap; }
.row-menu button:hover { background:#f6f1e9; }
.row-menu button.danger { color:#b3261e; }
.row-menu button.danger:hover { background:#fdf1f0; }
.row-menu hr { border:none; border-top:1px solid #f1ebe0; margin:4px 2px; }
/* 儀表板 */
.dash-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.dash-card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:none; min-width:0; }
.dash-label { font-size:13px; color:var(--muted); margin:0 0 6px; order:-1; }
.dash-card { display:flex; flex-direction:column; }
.dash-val { font-size:24px; font-weight:700; color:var(--ink); line-height:1.2; }
.dash-sub { font-size:12px; color:#a99f94; margin-top:4px; }
.dash-bars { margin-top:12px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:none; }
.dash-bar { background:#f1ebe0; }
/* 題庫工具列 */
.toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 12px; }
.qb-ctrl { height:36px; padding:0 10px; border:1px solid var(--line); border-radius:9px; font:inherit; font-size:14px; background:#fff; }
.search-box { position:relative; flex:1; min-width:180px; }
.search-box .ico { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:#b0a69b; }
.search-box input { width:100%; padding-left:34px; }
.qb-edit-link { background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:5px 12px; cursor:pointer; font:inherit; font-size:13px; }
.qb-edit-link:hover { border-color:var(--brand); color:var(--brand); opacity:1; }
/* 備份頁 */
.backup-card { padding:20px; }
#qb-status { color:#8a8178; }
.backup-target { font-size:13px; color:var(--muted); margin:0 0 14px; }
/* 彈窗與登入沿用主色 */
.modal-btn-primary, .login-btn { background:var(--brand); }
.modal-btn-primary:hover { background:var(--brand-h); }
.login-btn:hover { opacity:1; background:var(--brand-h); }
.admin-modal input:focus, .admin-login-box input:focus, .qb-modal input:focus, .qb-modal textarea:focus, .qb-modal select:focus { border-color:var(--brand); }
.link-btn { color:var(--brand); }
.admin-login-box h3 { display:flex; align-items:center; justify-content:center; gap:10px; }
@media(max-width:640px){
  .who #who-am-i { display:none; }
  .page-head { flex-direction:column; }
  .page-actions { justify-content:flex-start; }
  .tab { padding:10px 10px 11px; }
}
</style>
<!-- Firebase（真驗證：Auth + Firestore） -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- 啟動中（檢查登入狀態時顯示，避免閃過後台） -->
<div id="boot-screen">載入中…</div>

<!-- 登入畫面 -->
<div id="admin-login-screen">
  <div class="admin-login-box">
    <h3><span class="brand-mark">Q</span>QNA 管理後台</h3>
    <p>請用管理員 Email 與密碼登入</p>
    <input type="email" id="admin-email" placeholder="管理員 Email" autocomplete="username"
      onkeydown="if(event.key==='Enter')document.getElementById('admin-pw').focus()">
    <input type="password" id="admin-pw" placeholder="密碼" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')adminLogin()">
    <div class="login-error" id="admin-login-err"></div>
    <button class="login-btn" onclick="adminLogin()">登入 →</button>
    <button class="link-btn" onclick="toggleForgot()">忘記密碼？</button>

    <div id="admin-forgot-box">
      <p>🔑 輸入你的管理員 Email，我們會寄一封「重設密碼」信給你（Firebase 官方寄送）。</p>
      <input type="email" id="reset-email" placeholder="管理員 Email">
      <button class="login-btn" style="margin-bottom:0" onclick="sendReset()">寄送重設信</button>
      <div class="login-msg-ok" id="reset-msg"></div>
    </div>
  </div>
</div>

<main>
  <div id="admin-screen">
    <div class="topbar">
      <div class="topbar-row">

<script>
// ═══════════════════════════════════════════
//  設定
// ═══════════════════════════════════════════
const USERS_KEY   = 'tocfl_users';
const STORAGE_KEY = 'tocfl_exam_history';
const SUBJ_NAMES_ADMIN = {chinese:'國文', linguistics:'漢語語言學', teaching:'華語文教學', culture:'華人社會與文化'};
const SUBJ_ORDER_ADMIN = ['chinese','linguistics','teaching','culture'];
const MASTER_EMAIL = 'qnachinese@gmail.com';   // 主管理員（永遠有權限、唯一能管理其他管理員）

// 網址含 "staging" → 測試版資料庫（qna-chinese-staging）；其他網址 → 正式版資料庫
const IS_STAGING = /staging/i.test(location.hostname);
const FB_CONFIG = IS_STAGING ? {
  apiKey: "AIzaSyA7qWp5nbRtA2_7BM_mK-VpVDGXXjMpnRk",
  authDomain: "qna-chinese-staging.firebaseapp.com",
  projectId: "qna-chinese-staging",
  storageBucket: "qna-chinese-staging.firebasestorage.app",
  messagingSenderId: "393085795342",
  appId: "1:393085795342:web:656f3f5deb3fd96c4dd05f"
} : {
  apiKey: "AIzaSyCSgZ9DmLuKIqqbxrVgAcUfy-QJFhzjjp8",
  authDomain: "qna-chinese.firebaseapp.com",
  projectId: "qna-chinese",
  storageBucket: "qna-chinese.firebasestorage.app",
  messagingSenderId: "645044163415",
  appId: "1:645044163415:web:c33d1a22422de3083b6412"
};
// 測試版 / 留底版：畫面頂端顯示標記，避免跟正式版搞混
(function(){
  const host = location.hostname;
  const label = IS_STAGING ? '🧪 測試版（測試資料，不影響正式版）' : (/backup/i.test(host) ? '📦 留底版（舊版程式備份，資料與正式版共用）' : '');
  if(!label) return;
  const add = () => { if(document.getElementById('env-banner')) return;
    const b = document.createElement('div'); b.id = 'env-banner'; b.textContent = label;
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:'+(IS_STAGING?'#6a1b9a':'#455a64')+';color:#fff;text-align:center;font-size:13px;padding:5px 8px;font-family:sans-serif;opacity:.92;pointer-events:none';
    document.body.appendChild(b); };
  if(document.body) add(); else document.addEventListener('DOMContentLoaded', add);
})();
// 後台用獨立的 Firebase app（名稱 'admin'），登入狀態與學習者頁面分開，互不影響
const _adminApp = firebase.initializeApp(FB_CONFIG, 'admin');
const auth = _adminApp.auth();
const _db  = _adminApp.firestore();

let _currentRole = null;
let _adminLoginAttempt = false;   // 使用者剛按下「登入」   // 'master' | 'admin'
let _currentEmail = null;
let _adminEmails = new Set([MASTER_EMAIL]);   // 管理員 email,用來從學習者名單濾掉
const SUBJ_NAMES = {chinese:'國文',culture:'華人社會與文化',linguistics:'漢語語言學',teaching:'華語文教學'};
let _guestRecords = [];
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ═══════════════════════════════════════════
//  授權判斷
// ═══════════════════════════════════════════
const ADMIN_CLIENT_KEY = 'tocfl_admin_client';   // 一般管理員的登入狀態（主管理員走 Firebase）

async function getAdminAccounts(){
  try{
    const doc = await _db.collection('config').doc('admins').get();
    if(!doc.exists) return [];
    const data = doc.data();
    let accounts = Array.isArray(data.accounts) ? data.accounts.slice() : [];
    if(Array.isArray(data.emails)){
      data.emails.forEach(em=>{
        const e=(em||'').toLowerCase();
        if(e && e!==MASTER_EMAIL && !accounts.some(a=>(a.email||'').toLowerCase()===e)){ accounts.push({email:e}); }
      });
    }
    return accounts;
  }catch(e){ console.warn('getAdminAccounts:', e); return []; }
}
async function saveAdminAccounts(accounts){
  // v2：名單不再存密碼；adminEmails 給資料庫規則判斷「誰是管理員」
  const clean = accounts.map(a=>{ const o=Object.assign({}, a); delete o.pw; o.email=(o.email||'').toLowerCase(); return o; });
  const adminEmails = clean.map(a=>a.email).filter(Boolean);
  await _db.collection('config').doc('admins').set({accounts:clean, adminEmails, emails: firebase.firestore.FieldValue.delete()}, {merge:true});
}
async function getRole(email){
  if(!email) return null;
  email = email.toLowerCase();
  if(email === MASTER_EMAIL) return 'master';
  try{
    const accounts = await getAdminAccounts();
    return accounts.some(a=>(a.email||'').toLowerCase()===email) ? 'admin' : null;
  }catch(e){ console.warn('getRole:', e); return null; }
}

// ═══════════════════════════════════════════
//  登入 / 登出 / 忘記密碼
// ═══════════════════════════════════════════
function showScreen(which){
  document.getElementById('boot-screen').style.display       = which==='boot'  ? 'flex' : 'none';
  document.getElementById('admin-login-screen').style.display= which==='login' ? 'flex' : 'none';
  document.getElementById('admin-screen').style.display      = which==='panel' ? 'block': 'none';
}

async function adminLogin(){
  const email = (document.getElementById('admin-email').value||'').trim().toLowerCase();
  const pw    = document.getElementById('admin-pw').value;
  const err   = document.getElementById('admin-login-err');
  err.style.color='#c62828'; err.textContent='';
  if(!email){ err.textContent='請輸入 Email'; return; }
  if(!pw){ err.textContent='請輸入密碼'; return; }
  err.textContent='登入中…'; err.style.color='#888';
  _adminLoginAttempt = true;
  try{
    if(auth.currentUser) await auth.signOut();
    await auth.signInWithEmailAndPassword(email, pw);
    // 之後由 onAuthStateChanged 判斷身分
  }catch(e){
    _adminLoginAttempt = false;
    err.style.color='#c62828';
    const _bad = ['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'].includes(e.code);
    if(_bad && IS_STAGING && email===MASTER_EMAIL && confirm('測試版是獨立的資料庫，第一次使用需要建立主管理員帳號。\n要用剛剛輸入的密碼建立嗎？（之後會寄驗證信到 '+email+'）')){
      try{
        _adminLoginAttempt = true;
        const cred = await auth.createUserWithEmailAndPassword(email, pw);
        try{ await cred.user.sendEmailVerification(); }catch(_){}
        return;   // onAuthStateChanged 會提示去收驗證信
      }catch(e2){
        _adminLoginAttempt = false;
        err.textContent = e2.code==='auth/email-already-in-use' ? '測試版的主管理員帳號已存在：密碼不正確（可按「忘記密碼？」）' : '建立失敗：'+(e2.code||e2.message);
        return;
      }
    }
    if(_bad){
      err.textContent='Email 或密碼不正確（新的管理員請先到信箱點「重設密碼」信設定密碼）';
    } else if(e.code==='auth/invalid-email'){ err.textContent='Email 格式不正確';
    } else if(e.code==='auth/too-many-requests'){ err.textContent='嘗試次數過多，請稍後再試';
    } else { err.textContent='登入失敗：'+(e.code||e.message); }
  }
}

function renderQBList(){
  const sub=curQBSubject(); const arr=_qb[sub]||[];
  const ySel=document.getElementById('qb-year');
  const years=[...new Set(arr.map(q=>String(q.yr)))].sort();
  const curY=ySel.value;
  ySel.innerHTML='<option value="">全部年份</option>'+years.map(y=>'<option value="'+esc(y)+'">'+esc(y)+'</option>').join('');
  if(years.includes(curY)) ySel.value=curY;
  const yf=ySel.value;
  const kw=(document.getElementById('qb-search').value||'').trim();
  const rows=arr.map((q,i)=>({q:q,i:i})).filter(o=>(!yf||String(o.q.yr)===yf)&&(!kw||((o.q.q||'')+(o.q.opts||[]).join('')).indexOf(kw)>=0));
  let html='<table class="admin-table"><thead><tr><th style="width:48px">#</th><th style="width:64px">年份</th><th>題目</th><th style="width:56px">答案</th><th style="width:70px"></th></tr></thead><tbody>';

  rows.forEach(o=>{
    const stem=esc(String(o.q.q||'').replace(/<\/?u>/g,'')).slice(0,46);
    const ansLbl=o.q.free?'送分':[o.q.ans].concat(Array.isArray(o.q.alt)?o.q.alt:[]).map(k=>['A','B','C','D'][k]||'?').join('/');

function openQBEdit(idx){

async function saveQBItem(){
  const sub=curQBSubject(); const idx=parseInt(document.getElementById('qb-edit-idx').value,10);
  const yr=document.getElementById('qb-f-yr').value.trim();
  const qtext=document.getElementById('qb-f-q').value.trim();
  const opts=[0,1,2,3].map(k=>document.getElementById('qb-f-o'+k).value.trim());
  const ans=parseInt(document.getElementById('qb-f-ans').value,10);
  const free=document.getElementById('qb-f-free').checked;
  const exp=document.getElementById('qb-f-exp').value.trim();
  const errEl=document.getElementById('qb-edit-error');
  if(!yr||!qtext||opts.some(o=>!o)){ errEl.style.color='#c62828'; errEl.textContent='年份、題目、四個選項都必須填寫'; return; }
  const alt=[...document.querySelectorAll('#qb-f-alt input:checked')].map(cb=>parseInt(cb.value,10)).filter(k=>k!==ans);
  const item={yr:yr,q:qtext,opts:opts,ans:ans,exp:exp}; if(free) item.free=true; if(alt.length) item.alt=alt;
  const isNew = idx<0 || idx>=(_qb[sub]||[]).length;
  if(isNew) _qb[sub].push(item); else _qb[sub][idx]=item;
  errEl.style.color='#888'; errEl.textContent='儲存中…';
  try{
    await _db.collection('questionbank').doc(sub).set({items:_qb[sub], updatedAt:Date.now()});
    closeQBEdit(); renderQBList();
    const stEl=document.getElementById('qb-status'); if(stEl) stEl.textContent='已儲存 ✓ 雲端題庫共 '+qbCount()+' 題';
  }catch(e){ errEl.style.color='#c62828'; errEl.textContent='儲存失敗：'+(e.message||e); if(isNew) _qb[sub].pop(); }
}

async function deleteQBItem(){
  const sub=curQBSubject(); const idx=parseInt(document.getElementById('qb-edit-idx').value,10);
  if(idx<0||idx>=(_qb[sub]||[]).length) return;
  if(!confirm('確定要刪除這一題嗎？此動作無法復原。')) return;
  const removed=_qb[sub].splice(idx,1);
  try{
    await _db.collection('questionbank').doc(sub).set({items:_qb[sub], updatedAt:Date.now()});
    closeQBEdit(); renderQBList();
    const stEl=document.getElementById('qb-status'); if(stEl) stEl.textContent='已刪除 ✓ 雲端題庫共 '+qbCount()+' 題';
  }catch(e){ _qb[sub].splice(idx,0,removed[0]); alert('刪除失敗：'+(e.message||e)); }
}

let _adminUsers = [];   // 雲端讀到的學習者（含真實文件 ID _docId）

async function syncFromCloud(){
  try{
    let usersSnap = await _db.collection('users').get();
    _adminUsers = usersSnap.docs.map(d=>Object.assign({}, d.data(), {_docId:d.id}));
    if(_currentRole==='master'){
      const shells=[]; getUserGroups().forEach(g=>g.all.forEach(rec=>{ if(_isShell(rec,g)) shells.push(rec._docId); }));
      if(shells.length){
        for(const id of shells){ try{ await _db.collection('users').doc(id).delete(); }catch(e){ console.warn(e); } }
        usersSnap = await _db.collection('users').get();
        _adminUsers = usersSnap.docs.map(d=>Object.assign({}, d.data(), {_docId:d.id}));
      }
    }
    localStorage.setItem(USERS_KEY, JSON.stringify(usersSnap.docs.map(d=>{ const o=Object.assign({}, d.data()); delete o.pw; return o; })));
    let histDocs = [];
    try{
      const histSnap = await _db.collection('config').doc('examHistory').collection('records').get();
      histDocs = histSnap.docs;
      const hist = histSnap.docs.map(d=>d.data());
      hist.sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(hist));
    }catch(eh){ console.warn('讀取考試紀錄失敗:', eh); }
    try{
      const gSnap = await _db.collection('config').doc('guestHistory').collection('records').get();
      _guestRecords = gSnap.docs.map(d=>d.data());
      _guestRecords.sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
    }catch(eg){ console.warn('讀取訪客紀錄失敗:', eg); _guestRecords=[]; }
    renderAdminPanel();
    if(_currentRole==='master') masterMaintenance(histDocs);
  }catch(e){ console.warn('syncFromCloud:', e); }
}

// 主管理員開後台時自動做的升級維護：
//  1) 建立「舊帳號索引」legacy/{sha256(email)}，讓舊帳號能在新登入系統升級
//  2) 把已升級學習者的舊考試紀錄補上 uid（新規則下本人才讀得到）
//  3) 管理員名單補上 adminEmails 欄位（新規則用它判斷管理員）
async function masterMaintenance(histDocs){
  try{
    const idx = new Map();
    _adminUsers.forEach(u=>{
      if(u.uid || !u.email) return;
      const e=(u.email||'').toLowerCase();
      if(!idx.has(e)) idx.set(e, []);
      idx.get(e).push(u._docId || u.name);
    });
    for(const [e, names] of idx){
      try{ await _db.collection('legacy').doc(await hashPw(e)).set({names}); }catch(err){ console.warn('legacy index:', err); }
    }
    const uidByName = new Map(); _adminUsers.forEach(u=>{ if(u.uid && u.name) uidByName.set(u.name, u.uid); });
    let fixed = 0;
    for(const d of histDocs){
      const r = d.data();
      if(r.uid || !uidByName.has(r.name)) continue;
      try{ await d.ref.update({uid: uidByName.get(r.name)}); fixed++; }catch(err){ console.warn('backfill:', err); }
    }
    const doc = await _db.collection('config').doc('admins').get();
    const data = doc.exists ? doc.data() : {};
    const accounts = await getAdminAccounts();
    const want = accounts.map(a=>(a.email||'').toLowerCase()).filter(Boolean).sort().join(',');
    const have = (data.adminEmails||[]).slice().sort().join(',');
    if(want!==have || accounts.some(a=>a.pw) || Array.isArray(data.emails)) await saveAdminAccounts(accounts);
    if(idx.size || fixed) console.log('升級維護：舊帳號索引 '+idx.size+' 筆，補 uid 的紀錄 '+fixed+' 筆');
  }catch(e){ console.warn('masterMaintenance:', e); }
}
function getUserAccounts(){ return JSON.parse(localStorage.getItem(USERS_KEY)||'[]'); }

// 把「名稱+Email」相同的多筆合併成一組，保留有密碼的那筆為主
function getUserGroups(){
  const map = new Map();
  for(const u of _adminUsers){
    const key = (u.name||'')+'|'+((u.email||'').toLowerCase());
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(u);
  }
  return [...map.values()].map(g=>({ primary: g.find(x=>x.uid) || g.find(x=>x.pw) || g[0], all: g }));
}
function _isShell(rec, g){ return rec!==g.primary && rec._docId && !rec.pw && !rec.uid; }
function countCleanable(){
  let n=0; getUserGroups().forEach(g=>g.all.forEach(rec=>{ if(_isShell(rec,g)) n++; })); return n;
}

function fbSaveUserDoc(rec){
  const data = Object.assign({}, rec); delete data._docId;
  _db.collection('users').doc(rec._docId || rec.name).set(data).catch(e=>console.warn(e));
}
function fbDeleteUserHistory(name){
  _db.collection('config').doc('examHistory').collection('records').where('name','==',name).get().then(s=>s.docs.forEach(d=>d.ref.delete())).catch(e=>console.warn(e));
}

async function hashPw(pw){
  const data = new TextEncoder().encode(pw);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function _secondaryAuth(){
  let app = firebase.apps.find(a=>a.name==='creator');
  if(!app) app = firebase.initializeApp(FB_CONFIG, 'creator');
  return app.auth();
}
async function createAuthAccount(email, pw, sendVerify){
  const a = _secondaryAuth();
  try{ await a.setPersistence(firebase.auth.Auth.Persistence.NONE); }catch(e){}
  const cred = await a.createUserWithEmailAndPassword(email, pw);
  if(sendVerify){ try{ await cred.user.sendEmailVerification(); }catch(e){} }
  const uid = cred.user.uid;
  try{ await a.signOut(); }catch(e){}
  return uid;
}
function _randomPw(){
  const a = new Uint8Array(18); crypto.getRandomValues(a);
  return Array.from(a).map(b=>b.toString(36).padStart(2,'0')).join('') + 'Aa1!';
}
// 寄重設密碼信；對方若還沒有 Firebase 帳號，先用隨機密碼建立
async function sendResetFor(email){
  try{ await createAuthAccount(email, _randomPw(), false); }
  catch(e){ if(e.code!=='auth/email-already-in-use') throw e; }
  await auth.sendPasswordResetEmail(email);
}

let _rowMenuItems = {};
function openRowMenu(btn, key){
  closeRowMenu();

  const m = document.createElement('div'); m.className='row-menu'; m.id='row-menu';
  items.forEach(it=>{
    if(it==='-'){ m.appendChild(document.createElement('hr')); return; }

    b.onclick=()=>{ closeRowMenu(); it.run(); };
    m.appendChild(b);

// 跨紀錄彙總各科正確率
function _aggScores(recs){
  const agg={};
  recs.forEach(r=>{
    if(r.stats){
      Object.keys(r.stats).forEach(s=>{ const o=r.stats[s]; if(!o) return; if(!agg[s])agg[s]={c:0,t:0}; agg[s].c+=(o.correct||0); agg[s].t+=(o.total||0); });
    } else if(Array.isArray(r.subjects)){
      r.subjects.forEach(s=>{ if(!agg[s])agg[s]={c:0,t:0}; agg[s].c+=(r.correct||0); agg[s].t+=(r.total||0); });
    }
  });
  Object.keys(agg).forEach(s=>{ agg[s].pct = agg[s].t? Math.round(agg[s].c/agg[s].t*100):0; });
  return agg;
}
function _ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function _pctColor(p){ return p>=70?'#2e7d32':(p>=50?'#b8860b':'#c0392b'); }

function renderDashboard(){
  const el=document.getElementById('dashboard'); if(!el) return;
  const groups=getVisibleGroups();
  const history=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  const names=new Set(groups.map(g=>g.primary.name));
  const recs=history.filter(r=>names.has(r.name));
  const today=_ymd(new Date());
  const wa=new Date(); wa.setDate(wa.getDate()-6); const weekAgo=_ymd(wa);
  const todayN=recs.filter(r=>r.date===today).length;
  const weekN=recs.filter(r=>(r.date||'')>=weekAgo).length;
  const avg=recs.length? Math.round(recs.reduce((s,r)=>s+(r.pct||0),0)/recs.length):0;
  const cnt={}; recs.forEach(r=>{cnt[r.name]=(cnt[r.name]||0)+1;});
  let topName='—',topCnt=0; Object.keys(cnt).forEach(n=>{ if(cnt[n]>topCnt){topCnt=cnt[n];topName=n;} });
  const agg=_aggScores(recs);
  const subjArr=SUBJ_ORDER_ADMIN.filter(s=>agg[s]&&agg[s].t>0).map(s=>({s,pct:agg[s].pct,c:agg[s].c,t:agg[s].t}));
  let weak='—'; if(subjArr.length){ const w=subjArr.slice().sort((a,b)=>a.pct-b.pct)[0]; weak=SUBJ_NAMES_ADMIN[w.s]+'（'+w.pct+'%）'; }
  const card=(label,val,sub)=>'<div class="dash-card"><div class="dash-val">'+val+'</div><div class="dash-label">'+label+'</div>'+(sub?'<div class="dash-sub">'+sub+'</div>':'')+'</div>';
  let html='<div class="dash-cards">'
    +card('學生總數', groups.length, '')
    +card('今日作答', todayN+' 次', '近7天 '+weekN+' 次')
    +card('全體平均', avg+' 分', '共 '+recs.length+' 次作答')
    +card('最活躍學生', esc(topName), topCnt?topCnt+' 次':'')
    +card('最需加強', weak, '')
    +'</div>';
  if(subjArr.length){
    html+='<div class="dash-bars"><div style="font-size:.8rem;color:#888;margin-bottom:8px">各科全體平均正確率</div>';
    subjArr.forEach(o=>{ const col=_pctColor(o.pct);
      html+='<div class="dash-bar-row"><span class="dash-bar-name">'+SUBJ_NAMES_ADMIN[o.s]+'</span><div class="dash-bar"><div class="dash-bar-fill" style="width:'+o.pct+'%;background:'+col+'"></div></div><span class="dash-bar-pct" style="color:'+col+'">'+o.pct+'%</span><span class="dash-bar-cnt">'+o.c+'/'+o.t+'</span></div>';
    });
    html+='</div>';
  }
  el.innerHTML=html;
}

  const chron=recs.slice().reverse(); const pts=chron.slice(-12);
  // 最常錯的題
  const wm={};
  recs.forEach(r=>{ (r.questions||[]).forEach(q=>{ if(q&&q.correct===false&&!q.free){ const k=(q.subject||'')+'|'+(q.yr||'')+'|'+(q.q||''); if(!wm[k])wm[k]={n:0,subject:q.subject,yr:q.yr,q:q.q}; wm[k].n++; } }); });

  }

  // 每次作答
  h+='<div class="stu-sec-title">每次作答紀錄</div><table class="stu-rec-table"><thead><tr><th>日期時間</th><th>科目</th><th>年份</th><th>成績</th></tr></thead><tbody>';
  recs.forEach(r=>{ const col=_pctColor(r.pct||0);
    const subs=(r.subjects||[]).map(s=>SUBJ_NAMES_ADMIN[s]||s).join('、');
    const yrs=(r.years||[]).join('、');
    h+='<tr><td style="white-space:nowrap">'+esc(r.date||'')+'<br><span style="color:#aaa;font-size:.72rem">'+esc(r.time||'')+'</span></td>'
      +'<td>'+esc(subs)+'</td><td style="color:#888">'+esc(yrs)+'</td>'
      +'<td style="white-space:nowrap"><b style="color:'+col+'">'+(r.pct||0)+' 分</b> <span style="color:#999;font-size:.75rem">('+(r.correct||0)+'/'+(r.total||0)+')</span></td></tr>';
  });
  h+='</tbody></table>';

  // 最常錯的題
  if(topWrong.length){
    h+='<div class="stu-sec-title">最常錯的題（前 '+topWrong.length+'）</div>';

  }
  const groups = getVisibleGroups();

  if(!tbody) return;

  if(!groups.length){ tbody.innerHTML='<tr><td colspan="'+cols+'" class="empty-row">還沒有學習者。'+(isMaster?'按右上角「新增學習者」，或請學生自行註冊。':'')+'</td></tr>'; renderAdminsList(); updateCleanupBtn(); renderGuestRecords(); return; }
  const _subjNames = {chinese:'國文', linguistics:'漢語語言學', teaching:'華語文教學', culture:'華人社會與文化'};
  const _subjOrder = ['chinese','linguistics','teaching','culture'];
  function _scoresBySubject(recs){
    const seen={};   // recs 已新到舊;每科只保留最近一次
    recs.forEach(r=>{
      if(r.stats){
        Object.keys(r.stats).forEach(sub=>{
          const o=r.stats[sub];
          if(seen[sub]||!o||!o.total) return;
          seen[sub]={pct:Math.round(o.correct/o.total*100), date:r.date};
        });
      } else if(Array.isArray(r.subjects)){
        r.subjects.forEach(sub=>{ if(!seen[sub]) seen[sub]={pct:r.pct, date:r.date}; });
      }
    });
    const keys=Object.keys(seen).sort((a,b)=>_subjOrder.indexOf(a)-_subjOrder.indexOf(b));
    if(!keys.length) return '—';
    return keys.map(k=>'<div style="white-space:nowrap;line-height:1.5">'+esc(_subjNames[k]||k)+'：<b>'+seen[k].pct+'</b> 分 <span style="color:#999;font-size:.72rem">'+esc(seen[k].date||'')+'</span></div>').join('');
  }

    const actions = isMaster ? ('<td class="actions">'+dotsBtn("'L"+i+"'")+'</td>') : '';

      '<td>'+(acc.uid?'<span class="chip ok">已升級</span>':'<span class="chip wait" title="還沒用新的登入系統登入過">待升級</span>')+'</td>'+

function renderGuestRecords(){
  const tbody=document.getElementById('guest-tbody');
  if(!tbody) return;
  const recs=_guestRecords||[];
  const sum=document.getElementById('guest-summary');
  const t=new Date();
  const td=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  // 依瀏覽器(gid)分組：同一個瀏覽器算同一位訪客
  const groups=new Map();
  recs.forEach(r=>{
    const key = r.gid || ('once_'+(r.ts||((r.date||'')+(r.time||''))));
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });
  const list=[...groups.entries()].map(([gid,arr])=>{
    arr.sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
    return {gid, arr, latest:arr[0]};
  });
  list.sort((a,b)=>((b.latest.date||'')+(b.latest.time||'')).localeCompare((a.latest.date||'')+(a.latest.time||'')));
  const todayVisitors=list.filter(g=>g.arr.some(r=>r.date===td)).length;
  if(sum) sum.textContent='共 '+list.length+' 位訪客　今日 '+todayVisitors+' 位';
  const clr=document.getElementById('guest-clear-btn');
  if(clr) clr.style.display=(_currentRole==='master' && recs.length)?'':'none';
  if(!list.length){ tbody.innerHTML='<tr><td colspan="5" class="empty-row">還沒有訪客試做紀錄。</td></tr>'; return; }
  tbody.innerHTML=list.slice(0,300).map(g=>{
    const r=g.latest;
    const subjSet=new Set();
    g.arr.forEach(rec=>(rec.subjects||[]).forEach(x=>subjSet.add(x)));
    const subs=[...subjSet].map(s=>SUBJ_NAMES[s]||s).join('、')||'—';
    const score=(r.correct!=null&&r.total!=null)?(r.pct+'分（'+r.correct+'/'+r.total+'）'):'—';
    const label='訪客 #'+String(g.gid).slice(-4);
    return '<tr><td>'+label+'</td><td>'+g.arr.length+' 次</td><td>'+subs+'</td><td>'+score+'</td><td>'+(r.date||'—')+' '+((r.time||'').slice(0,5))+'</td></tr>';
  }).join('');
}

async function clearGuestRecords(){
  if(_currentRole!=='master') return;
  if(!confirm('確定要清空所有訪客試做紀錄嗎？此動作無法復原。')) return;
  try{
    const snap=await _db.collection('config').doc('guestHistory').collection('records').get();
    for(const d of snap.docs){ try{ await d.ref.delete(); }catch(e){ console.warn(e); } }
  }catch(e){ console.warn('clearGuestRecords:', e); }
  _guestRecords=[]; renderGuestRecords();
}

async function cleanupDuplicates(){
  if(_currentRole!=='master') return;
  const toDelete = [];
  getUserGroups().forEach(g=>g.all.forEach(rec=>{ if(_isShell(rec,g)) toDelete.push(rec); }));
  if(!toDelete.length){ alert('沒有空殼帳號需要清理'); return; }
  if(!confirm('將刪除 '+toDelete.length+' 筆「重複的空殼」帳號（每人保留主要的那一筆，考試紀錄不受影響）。確定嗎？')) return;
  for(const rec of toDelete){ try{ await _db.collection('users').doc(rec._docId).delete(); }catch(e){ console.warn(e); } }
  alert('✅ 已清除 '+toDelete.length+' 筆空殼帳號');
  syncFromCloud();
}

async function addAdmin(){   // 彈窗「儲存」：新增或編輯
  if(_currentRole!=='master'){ return; }
  const email=(document.getElementById('newadmin-email').value||'').trim().toLowerCase();
  const pw=document.getElementById('newadmin-pw').value||'';
  const name=(document.getElementById('newadmin-name').value||'').trim();
  const err=document.getElementById('newadmin-error'); err.textContent='';
  if(!email){ err.textContent='請輸入 Email'; return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Email 格式不正確'; return; }
  if(email===MASTER_EMAIL){ err.textContent='這已經是主管理員'; return; }
  try{
    let accounts = await getAdminAccounts();
    let note = '';
    if(_editAdminOrig===null){
      if(accounts.some(a=>(a.email||'').toLowerCase()===email)){ err.textContent='此 Email 已是管理員'; return; }
      if(pw.length<6){ err.textContent='密碼至少 6 碼'; return; }
      err.style.color='#888'; err.textContent='建立中…';
      try{
        await createAuthAccount(email, pw, false);   // 不在新增時寄信；對方第一次登入時才寄驗證信
        note = '密碼：'+pw+'\n\n請把 Email 和密碼給對方。對方第一次登入後台時，系統會寄一封驗證信到他的信箱，點連結驗證後再登入一次就能使用。';
      }catch(e){
        if(e.code!=='auth/email-already-in-use'){ err.style.color='#c62828'; err.textContent='建立失敗：'+(e.code||e.message); return; }
        note = '這個 Email 本來就有帳號，對方請用自己原本的密碼登入（忘記可在登入頁按「忘記密碼」）。剛剛輸入的密碼不會生效。';
      }
      accounts.push({email, name, authReady:true});
    } else {
      const acc = accounts.find(a=>(a.email||'').toLowerCase()===_editAdminOrig);
      if(!acc){ err.textContent='找不到此管理員'; return; }
      if(email!==_editAdminOrig && accounts.some(a=>(a.email||'').toLowerCase()===email)){ err.textContent='此 Email 已被使用'; return; }
      if(email!==_editAdminOrig){ acc.authReady=false; note='Email 已變更，請按「寄重設密碼信」讓對方用新 Email 設定密碼。'; }
      acc.email = email; acc.name = name;
    }
    await saveAdminAccounts(accounts);
    err.style.color='#c62828'; err.textContent='';
    closeAdminAddModal();
    renderAdminsList();
    alert('✅ 已儲存管理員：'+email + (note ? '\n'+note : ''));
  }catch(e){ err.style.color='#c62828'; err.textContent='儲存失敗：'+(e.code||e.message); }
}

async function resetAdminPw(email){
  if(_currentRole!=='master') return;
  if(!confirm('寄一封「重設密碼」信到 '+email+'？\n對方點信中連結就能自己設定新密碼。')) return;
  try{
    await sendResetFor(email);
    const accounts = await getAdminAccounts();
    const acc = accounts.find(a=>(a.email||'').toLowerCase()===(email||'').toLowerCase());
    if(acc && !acc.authReady){ acc.authReady = true; await saveAdminAccounts(accounts); }
    renderAdminsList();
    alert('✅ 重設信已寄到 '+email+'（請對方也檢查垃圾信匣）');
  }catch(e){ alert('寄送失敗：'+(e.code||e.message)); }
}

async function deleteAdmin(email){
  if(_currentRole!=='master'){ alert('只有主管理員能刪除'); return; }
  if((email||'').toLowerCase()===MASTER_EMAIL){ alert('無法刪除主管理員'); return; }
  if(!confirm('確定刪除管理員 '+email+' 嗎？刪除後他將無法登入後台。')) return;
  try{
    let accounts = await getAdminAccounts();
    accounts = accounts.filter(a=>(a.email||'').toLowerCase()!==(email||'').toLowerCase());
    await saveAdminAccounts(accounts);
    renderAdminsList();
  }catch(e){ alert('刪除失敗：'+(e.code||e.message)); }
}

function deleteUser(gi){

  fbDeleteUserHistory(name);
  const accounts = getUserAccounts().filter(a=>!(a.name===name && (a.email||'').toLowerCase()===email));
  localStorage.setItem(USERS_KEY, JSON.stringify(accounts));
  const history = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]').filter(r=>r.name!==name);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  syncFromCloud();
}

async function saveModal(){
  if(_currentRole!=='master') return;
  const name=document.getElementById('modal-name').value.trim();
  const pw=document.getElementById('modal-pw').value;
  const email=document.getElementById('modal-email').value.trim().toLowerCase();
  const err=document.getElementById('modal-error');
  err.style.color='#c62828';
  if(!name){ err.textContent='請輸入名稱'; return; }
  if(_isAdd){
    if(!email){ err.textContent='請輸入 Gmail（學習者用它登入）'; return; }
    if(pw.length<6){ err.textContent='密碼至少 6 碼'; return; }
    if(_adminUsers.find(a=>a.name===name)){ err.textContent='此名稱已存在'; return; }
    err.style.color='#888'; err.textContent='建立中…';
    let uid = null, note = '';
    try{ uid = await createAuthAccount(email, pw, false); }
    catch(e){
      if(e.code!=='auth/email-already-in-use'){ err.style.color='#c62828'; err.textContent='建立失敗：'+(e.code||e.message); return; }
      note = '\n這個 Email 本來就有帳號，學習者請用自己原本的密碼登入（第一次登入會要求驗證信箱）。';
    }
    const rec = {name, email, createdAt:new Date().toISOString(), method:'admin'};
    if(uid) rec.uid = uid;
    try{
      await _db.collection('users').doc(name).set(rec);
      if(!uid){ await _db.collection('legacy').doc(await hashPw(email)).set({names:[name]}); }
    }catch(e){ err.style.color='#c62828'; err.textContent='儲存失敗：'+(e.code||e.message); return; }
    alert('✅ 已建立學習者：'+name+'\nEmail：'+email+(uid?'\n密碼：'+pw:'')+note);
  } else {
    const g=getUserGroups()[_editGroupIdx]; if(!g){ err.textContent='帳號不存在'; return; }
    const rec=g.primary;
    if(name!==rec.name && _adminUsers.find(a=>a.name===name && a!==rec)){ err.textContent='此名稱已被使用'; return; }
    if(pw){
      if(rec.uid){ err.textContent='已升級的帳號無法在這裡改密碼，請關閉後按「寄重設密碼信」'; return; }
      rec.pw = await hashPw(pw);
    }
    rec.name=name;
    if(email && email!==(rec.email||'').toLowerCase()){
      if(rec.uid){ err.textContent='已升級的帳號請由學習者自己在「帳號設定」改信箱'; return; }
      rec.email=email;
    }
    fbSaveUserDoc(rec);
  }
  err.textContent='';
  closeModal();
  setTimeout(syncFromCloud, 500);
}

//  資料備份與還原（主管理員限定）
// ═══════════════════════════════════════════
const BACKUP_COLLECTIONS = ['users', 'config/examHistory/records', 'config/guestHistory/records', 'questionbank'];
const BACKUP_DOCS = ['config/admins'];
function _bkStatus(t, c){ const el=document.getElementById('backup-status'); if(el){ el.style.color=c||'#555'; el.textContent=t; } }

async function downloadBackup(){
  if(_currentRole!=='master'){ alert('只有主管理員能下載備份'); return; }
  _bkStatus('備份中…');
  try{
    const out = { app:'qna-exam-platform', version:1, project:FB_CONFIG.projectId, exportedAt:new Date().toISOString(), collections:{}, docs:{} };
    let n = 0;
    for(const p of BACKUP_COLLECTIONS){
      const snap = await _db.collection(p).get();
      out.collections[p] = snap.docs.map(d=>({ id:d.id, data:d.data() }));
      n += snap.docs.length;
    }
    for(const p of BACKUP_DOCS){
      const [c, id] = [p.slice(0, p.lastIndexOf('/')), p.slice(p.lastIndexOf('/')+1)];
      const d = await _db.collection(c).doc(id).get();
      out.docs[p] = d.exists ? d.data() : null;
    }
    const pad = x=>String(x).padStart(2,'0'); const t = new Date();
    const name = 'qna-備份-'+FB_CONFIG.projectId+'-'+t.getFullYear()+pad(t.getMonth()+1)+pad(t.getDate())+'-'+pad(t.getHours())+pad(t.getMinutes())+'.json';
    const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    _bkStatus('✅ 已下載 '+name+'（共 '+n+' 筆資料）', '#2e7d32');
    return out;
  }catch(e){ console.warn(e); _bkStatus('備份失敗：'+(e.code||e.message), '#c62828'); }
}

async function restoreFromData(data){
  if(_currentRole!=='master') throw new Error('只有主管理員能還原');
  if(!data || data.app!=='qna-exam-platform' || !data.collections) throw new Error('這不是本平台的備份檔');
  let n = 0;
  for(const [p, docs] of Object.entries(data.collections)){
    if(!BACKUP_COLLECTIONS.includes(p)) continue;
    for(const d of docs){ await _db.collection(p).doc(d.id).set(d.data); n++; }
  }
  for(const [p, v] of Object.entries(data.docs||{})){
    if(!BACKUP_DOCS.includes(p) || !v) continue;
    const [c, id] = [p.slice(0, p.lastIndexOf('/')), p.slice(p.lastIndexOf('/')+1)];
    await _db.collection(c).doc(id).set(v); n++;
  }
  return n;
}

async function restoreBackup(input){
  const file = input.files && input.files[0]; input.value = '';
  if(!file) return;
  if(_currentRole!=='master'){ alert('只有主管理員能還原'); return; }
  let data;
  try{ data = JSON.parse(await file.text()); }catch(e){ alert('檔案讀取失敗，請確認是本平台下載的備份檔'); return; }
  const cnt = Object.values(data.collections||{}).reduce((s,a)=>s+(a.length||0),0);
  const msg = '要把備份檔還原到「'+FB_CONFIG.projectId+'」'+(IS_STAGING?'（測試版）':'（正式版）')+' 嗎？\n\n'+
    '備份來源：'+(data.project||'?')+'，備份時間：'+(data.exportedAt||'?')+'，共 '+cnt+' 筆資料。\n'+
    '同名的資料會被備份檔覆蓋；備份檔裡沒有的資料不會被刪除。';
  if(!confirm(msg)) return;
  if(!IS_STAGING){
    const t = prompt('⚠️ 你正在還原「正式版」資料庫。\n確定的話請輸入：還原正式版');
    if(t !== '還原正式版'){ alert('已取消'); return; }
  }
  _bkStatus('還原中…（請勿關閉頁面）');
  try{
    const n = await restoreFromData(data);
    _bkStatus('✅ 還原完成，共寫入 '+n+' 筆資料', '#2e7d32');
    syncFromCloud(); if(typeof loadQBAdmin==='function') loadQBAdmin();
  }catch(e){ console.warn(e); _bkStatus('還原失敗：'+(e.code||e.message), '#c62828'); }
}
