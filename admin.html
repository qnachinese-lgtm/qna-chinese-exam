rubric":[]},{"id":"teaching|2016|3","subject":"teaching","yr":"2016","no":3,"pts":15,"q":"在語言課室中，教師要學生分組討論(三人一組)進行一項任務，最後上臺做角色扮演。\n情境是在一個大風雪的晚上，兩個一起旅行的朋友因為找不到住的地方，在一家旅館的櫃檯前，請求給予協助。設想你是這位教師，須事先向學生說明你所採取的評量方式以及評分標準，以利整個活動的進行。請敘述你的評分方式(6 分)以及評分標準(9分)，敘述時也請說明你的理念。","ref":"","rubric":[]},{"id":"linguistics|2016|1","subject":"linguistics","yr":"2016","no":1,"pts":10,"q":"Halliday 與 Hasan (1976)著重描述句法表層相鄰句子之間的連接/銜接(cohesion)，並將篇章的銜接手段分為五大類：照應/指涉/指代(reference)，替代(substitution)，省略\n(ellipsis)，連接詞語(conjunction)和詞語(彙)銜接(lexical cohesion)。分析下面文章裏所包含的銜接手段，回答時請抄寫原文，並在相關詞語上作答說明。\n孟子曰：\n「…..故天將降大任於斯人也，必先苦其心志，勞其筋骨，餓其體膚，空乏其身，行拂亂其所為，所以動心忍性，曾益其所不能。」《孟子•告子下》","ref":"","rubric":[]},{"id":"linguistics|2016|2","subject":"linguistics","yr":"2016","no":2,"pts":10,"q":"試著分析下列句中七個「多」，共可分為幾類，並說明其詞性與意義。\nA：你看今天的天氣多好啊！\nB：對啊！天氣一好，外面總是有那麼多人。\nA：那你覺得人多是好還是不好？\nB：我不太喜歡人多的地方，人多的地方，吵吵鬧鬧的多煩人啊！\n但如果我想多吃東西的話，我一定要去人少的餐廳。","ref":"","rubric":[]},{"id":"linguistics|2016|3","subject":"linguistics","yr":"2016","no":3,"pts":10,"q":"請分辨下列句子畫線部分的詞類歸屬，並說明它們的用法。\n（1） a、他喜歡在晚上看書。\nb、我在聽音樂。\n（2） a、氣象預報説今天下午會下雨。\nb、我會說日語。\nc、下了班，我會準時回家。","ref":"","rubric":[]},{"id":"culture|2016|1","subject":"culture","yr":"2016","no":1,"pts":16,"q":"請詳細敘述楊柳、竹子豐富的文化內涵。（16分）","ref":"","rubric":[]},{"id":"culture|2016|2","subject":"culture","yr":"2016","no":2,"pts":24,"q":"飲食即生命之源，文化的縮影。請依春、夏、秋、冬四季，舉例說明華人社會傳統節日飲食之內涵與文化意義。（24分）","ref":"","rubric":[]},{"id":"teaching|2017|1","subject":"teaching","yr":"2017","no":1,"pts":14,"q":"參考以下例句，\n（一）請針對語義及語法方面，說明近義詞組「一樣」與「同樣」之異同（8 分）\n；（二）並請提出一套能使學生迅速與正確地掌握此組近義詞的教學步驟（6 分）。\n（1）關於這則新聞評論，我和你有同樣/一樣的觀點。\n（2）這兩道菜同樣/一樣美味。\n（3）這兩本書的價錢一樣。\n（4）他們兩兄弟長得一樣，是雙胞胎嗎？\n（5）小明跟我一樣，一直在為你的傷勢祈禱。","ref":"","rubric":[]},{"id":"teaching|2017|2","subject":"teaching","yr":"2017","no":2,"pts":10,"q":"若學生產生「我喜歡看書在家裡」這樣的病句，你身為華語教師會如何加以糾正和提供回饋？請先簡單說明回饋有哪些類型（6 分），並從中選出兩種，說明你如何利用你選出的兩個方法給予上述學生回饋。（4 分）","ref":"","rubric":[]},{"id":"teaching|2017|3","subject":"teaching","yr":"2017","no":3,"pts":6,"q":"數位時代來臨，許多華語學習者無須動手寫漢字，只要透過數位工具應用輸入法即可挑選漢字完成篇章段落。因應此種時代潮流，請提出數位時代之漢字教學重點與教學策略。(6 分)","ref":"","rubric":[]},{"id":"linguistics|2017|1","subject":"linguistics","yr":"2017","no":1,"pts":10,"q":"請以語用學的理論陳述下面兩則例子的意涵。\n(1)請說明下面兩個句子畫線部分的意涵。\n「會場上大家一致讚揚他這個人沒有架子，他表現得非常謙虛，不斷和大家握手拍照」\n「連他的好朋友都說他那個人做事一向不管別人，跟他合作一定要多加小心。」\n(2)請說明下面對話的意涵。\n甲:「今天晚上的活動你要參加嗎？」\n乙:「我媽要我回家一趟。」","ref":"","rubric":[]},{"id":"linguistics|2017|2","subject":"linguistics","yr":"2017","no":2,"pts":10,"q":"請就信息傳遞的規律，說明“雨下了”和“下雨了”的差異。","ref":"","rubric":[]},{"id":"linguistics|2017|3","subject":"linguistics","yr":"2017","no":3,"pts":10,"q":"請說明「白頭偕老」、「白他一眼」、「白吃一頓」、「黑白兩分」中四個「白」字，各屬於什麼詞？其語法功能為何？","ref":"","rubric":[]},{"id":"culture|2017|1","subject":"culture","yr":"2017","no":1,"pts":20,"q":"媽祖信仰在華人地區有極大的影響力，也是臺灣最普遍的民間信仰之一。請說明媽祖與臺灣的關係，及你所知道的媽祖遶境活動。（20分）","ref":"","rubric":[]},{"id":"culture|2017|2","subject":"culture","yr":"2017","no":2,"pts":20,"q":"古時子女成年有舉行冠禮、及笄禮之傳統，臺灣亦有「做十六歲」的習俗，請說明此文化習俗的目的與意義。（20分）","ref":"","rubric":[]},{"id":"teaching|2018|1","subject":"teaching","yr":"2018","no":1,"pts":15,"q":"請針對 Chinese as a heritage language learners（CHL learners）、Chinese as a second language learners（CSL learners）與 Chinese as a foreign language learners（CFL learners），進行學習者背景分析及教學策略差異說明。（15 分）","ref":"","rubric":[]},{"id":"teaching|2018|2","subject":"teaching","yr":"2018","no":2,"pts":15,"q":"請找出下列三句偏誤的主要原因，並提出教學對策。（15 分）\n（1）如果你不去參加舞會，就我不陪你逛街。\n（2）他想結婚一個北方女孩。\n（3）我上大學在東京。","ref":"","rubric":[]},{"id":"linguistics|2018|1","subject":"linguistics","yr":"2018","no":1,"pts":10,"q":"請比較下列四個句子，並試著去解釋為什麼（C）是不合華語語法的。\n(A)你喜歡誰寫的書呢？\n(B)你喜歡寫什麼書的人呢？\n(C)＊你喜歡他為什麼寫的書呢？\n(D)你喜歡他（在）什麼時候寫的書呢？","ref":"","rubric":[]},{"id":"linguistics|2018|2","subject":"linguistics","yr":"2018","no":2,"pts":10,"q":"請以實際例字佐證，並說明國語的ㄝㄜㄛ三個元音，在聲韻結合上有何特色？","ref":"","rubric":[]},{"id":"linguistics|2018|3","subject":"linguistics","yr":"2018","no":3,"pts":10,"q":"關於數詞「二」及「兩」，用法上有些情形需使用「二」，有些需使用「兩」，這兩者的用法差異該如何整理歸納？請就「結構」及「語意」兩方面差異特徵分別說明。","ref":"","rubric":[]},{"id":"culture|2018|1","subject":"culture","yr":"2018","no":1,"pts":20,"q":"數字在華人文化中占有重要地位，具有豐富的文化意涵。在許多民俗文化中，數字都有著喜慶或禁忌的觀念，請就日常生活的喜慶與禁忌兩個面向各自舉例說明。(20分)","ref":"","rubric":[]},{"id":"culture|2018|2","subject":"culture","yr":"2018","no":2,"pts":20,"q":"請具體說明科舉制度的利弊與功過。(20分)","ref":"","rubric":[]},{"id":"teaching|2019|1","subject":"teaching","yr":"2019","no":1,"pts":10,"q":"演繹式的語法教學（deductive grammar teaching）和歸納式的語法教學（inductive grammar teaching）有什麼不同？請舉例說明。（10 分）","ref":"","rubric":[]},{"id":"teaching|2019|2","subject":"teaching","yr":"2019","no":2,"pts":10,"q":"如何進行非固定短語的語塊教學？請分別簡述以下兩種語塊形式的教學策略。（10 分）\n（一）框架語：\n「...三...四」，如：低三下四。\n（二）口語慣用句式：「一...就是...」，如：他一走就是半年。","ref":"","rubric":[]},{"id":"teaching|2019|3","subject":"teaching","yr":"2019","no":3,"pts":14,"q":"請根據以下例句，回答題（一）及題（二）\n：\n（甲）公司最近雇用了一批老礦工進行坑道修改工程。\n（乙）王先生在咖啡館裡與老同學敘舊。\n（丙）警員有時會來整頓流動攤販並開罰單，但過不久，攤販又聚集，這已經是老問題了。\n（一）區分「老」的不同語意及說明此三者的關聯性。（7 分）\n（二）請提出一套能使學生掌握此組多義詞的教學方法。（7 分）","ref":"","rubric":[]},{"id":"linguistics|2019|1","subject":"linguistics","yr":"2019","no":1,"pts":10,"q":"試從詞法與句法的角度說明「幫助」與「幫忙」的差別，並舉例闡述之。","ref":"","rubric":[]},{"id":"linguistics|2019|2","subject":"linguistics","yr":"2019","no":2,"pts":10,"q":"解釋下列例句中，畫線部分量詞短語的意義及語法功能有何不同？\n(1)他朝那個人一拳打了下去。\n(2)他打了那個人一拳。\n(3)他一口氣跑了回家。\n(4)他嚥了一口氣之後就離開人世。","ref":"","rubric":[]},{"id":"linguistics|2019|3","subject":"linguistics","yr":"2019","no":3,"pts":10,"q":"在「把」字句中，用「把」引進的對象可以是謂語動詞的工具、處所、使動者等。請分析下列句中「把」字引進的成份與動詞是什麼關係？\n(1)他把床睡垮了。\n(2)為了不讓狗叼走，他把一個盤子扣在那碗肉上。\n(3)地這樣鏟了三遍，把大家都累壞了。","ref":"","rubric":[]},{"id":"culture|2019|1","subject":"culture","yr":"2019","no":1,"pts":20,"q":"佛教東傳對中華文化有何影響？請從思想、學術、文學、藝術等方面作答。(20分)","ref":"","rubric":[]},{"id":"culture|2019|2","subject":"culture","yr":"2019","no":2,"pts":20,"q":"「天地君親師」可視為華人文化中的另一種「五倫」，試就所知，申論天地君親師為何發展成祭祀與信仰，並融入華人生活。(20分)","ref":"","rubric":[]},{"id":"linguistics|2020|1","subject":"linguistics","yr":"2020","no":1,"pts":10,"q":"請以 A.「不怕酸」、B.「酸不怕」和 C.「怕不酸」為例，說明漢語語序、語法和詞類的特點。","ref":"","rubric":[]},{"id":"linguistics|2020|2","subject":"linguistics","yr":"2020","no":2,"pts":10,"q":"請根據下列例句，將「粗」的語義分類。\n(A)這棵樹長得很粗。\n(B)現在手工的製作很粗。\n(C)他十分粗心，考試時總是出錯。\n(D)他的手臂比你的粗。\n(E)搬家工人的工作十分粗重。","ref":"","rubric":[]},{"id":"linguistics|2020|3","subject":"linguistics","yr":"2020","no":3,"pts":10,"q":"現代漢語能願動詞「會」、「能」、「可以」，分別表示意願和可能兩種意義。請依肯定、否定以及疑問句，舉例說明這三者的差異。","ref":"","rubric":[]},{"id":"culture|2020|1","subject":"culture","yr":"2020","no":1,"pts":15,"q":"華語文教學中，常採用漢外對比法說明文化因素。請從顏色、動物和成語各舉一個例子，說明華人文化與其他文化的差異。（15 分）","ref":"","rubric":[]},{"id":"culture|2020|2","subject":"culture","yr":"2020","no":2,"pts":15,"q":"孟子曰：\n「君子有三樂，而王天下不與存焉。父母俱存，兄弟無故，一樂也；仰不愧於天，俯不怍於人，二樂也；得天下英才而教育之，三樂也。」請利用這段話說明華人的價值觀。（15 分）","ref":"","rubric":[]},{"id":"culture|2020|3","subject":"culture","yr":"2020","no":3,"pts":10,"q":"梅、蘭、竹、菊稱為「四君子」，是中華傳統詩文書畫中常見的題材，更是華人借物喻志的象徵。請舉例說明這四種植物的文化寓意。（10 分）","ref":"","rubric":[]},{"id":"teaching|2021|1","subject":"teaching","yr":"2021","no":1,"pts":15,"q":"王老師為了幫助學生擴展詞彙量，上課時介紹同義詞和近義詞。以下有兩組詞語，請任擇一組，針對詞性、詞義和用法三方面進行比較分析，協助二語學習者找到關鍵性的區別特徵。（15 分）\n(1)突然／忽然\n(2)後來／然後","ref":"","rubric":[]},{"id":"teaching|2021|2","subject":"teaching","yr":"2021","no":2,"pts":15,"q":"語言教學原則強調「結構、功能、文化」之結合。請以「道歉」為主題，運用上述原則於初級成人學生之華語口語能力的教學課程設計上，並說明你的教學重點為何？（15分）","ref":"","rubric":[]},{"id":"linguistics|2021|1","subject":"linguistics","yr":"2021","no":1,"pts":10,"q":"以下為同事某甲和某乙的閒談，請以合作原則(Cooperative Principle)與禮貌原則(Politeness Principle)分別解釋乙的回應如何達到言談溝通的目的？\n甲：我的身材媲美阿諾史瓦辛格。\n乙：那我就是瑪麗蓮夢露了。","ref":"","rubric":[]},{"id":"linguistics|2021|2","subject":"linguistics","yr":"2021","no":2,"pts":10,"q":"以下兩句分屬何種疑問句型？「什麼」在兩句的功能有何不同？\n(A)你想吃點什麼嗎？\n(B)你想吃點什麼呢？","ref":"","rubric":[]},{"id":"linguistics|2021|3","subject":"linguistics","yr":"2021","no":3,"pts":10,"q":"請從語意及語法方面說明「幫手」、「選手」、「高手」、「水手」、「對手」這些詞裡「手」\n與前面的詞之間關係為何？","ref":"","rubric":[]},{"id":"culture|2021|1","subject":"culture","yr":"2021","no":1,"pts":20,"q":"「拜土地公」是臺灣常見的民間信仰，請說明其文化思維。(20 分)","ref":"","rubric":[]},{"id":"culture|2021|2","subject":"culture","yr":"2021","no":2,"pts":20,"q":"傳統華人社會講求「慎終追遠」、「以孝傳家」，隨著社會變遷，現今華人家庭在以上觀念的傳遞與實踐有何改變？(20 分)","ref":"","rubric":[]},{"id":"teaching|2022|1","subject":"teaching","yr":"2022","no":1,"pts":15,"q":"以下為一段華語老師透過提問操練句型教學的現場節錄，請分析老師的提問技巧，並且說明老師如何有效地達到教學目標。(15 分)\n目標句型：S+V+O+V+到+time point (+才/就+VP)\n老\n師：你昨天學中文學到幾點？\n學生 A：我昨天學中文學到九點。\n老\n師：(指別的學生)你呢？\n學生 B：昨天我學中文學到十二點。\n老\n師：喔，你是好學生。(再問其他人)誰學中文學到十二點？\n學生 C：我學中文也學到十二點。\n老\n師：昨天你學中文學到十二點以後做什麼了？\n(老師指黑板上句型的後續部分，提示學生用「才」或者「就」回答)\n學生 C：我學中文學到十二點就睡覺了。\n老\n師：(再指別的學生)你呢？\n學生 D：我學中文學到今天早上兩點才睡覺。","ref":"","rubric":[]},{"id":"teaching|2022|2","subject":"teaching","yr":"2022","no":2,"pts":15,"q":"試從語言使用角度、學習者角度、教學角度，分析通用華語與專業華語之差異。(15 分)","ref":"","rubric":[]},{"id":"linguistics|2022|1","subject":"linguistics","yr":"2022","no":1,"pts":10,"q":"擦音(fricative)的發音方式有什麼特質？漢語有哪些無聲擦音(voiceless fricative)？每個擦音使用什麼發音部位？(10 分)","ref":"","rubric":[]},{"id":"linguistics|2022|2","subject":"linguistics","yr":"2022","no":2,"pts":10,"q":"請分別說明以下兩個句子表達什麼意思，並分析兩句中「穿多少穿多少」的語法結構有什麼不同。(10 分)\n(1)冬天能穿多少穿多少。\n(2)夏天能穿多少穿多少。","ref":"","rubric":[]},{"id":"linguistics|2022|3","subject":"linguistics","yr":"2022","no":3,"pts":10,"q":"試分析下列各句中「到」的語意與語法功能。(10 分)\n(1)秋天快到了。\n(2)我終於找到錢包了。\n(3)他上個月搬到日本了。\n(4)把成績單寄到學生家。\n(5)李四昨天寫功課寫到幾點呢？","ref":"","rubric":[]},{"id":"culture|2022|1","subject":"culture","yr":"2022","no":1,"pts":20,"q":"「留餘匾」製於清朝同治十年（西元 1871 年），匾上題寫家訓 174 字，其中以「四留銘」最為有名：\n「留有餘，不盡之巧以還造化；留有餘，不盡之祿以還朝廷；留有餘，不盡之財以還百姓；留有餘，不盡之福以還子孫。」請從「四留銘」之觀點，說明華人「有餘」的價值觀。（20 分）","ref":"","rubric":[]},{"id":"culture|2022|2","subject":"culture","yr":"2022","no":2,"pts":20,"q":"請分析海外華人社會的會館組織、華文學校與華人報章在華人社會的主要特點。（20 分）","ref":"","rubric":[]},{"id":"teaching|2023|1","subject":"teaching","yr":"2023","no":1,"pts":15,"q":"請看以下的對話：\nA：你明天想去買東西嗎？\nB：還好。\nA：你有沒有什麼東西想買的，我可以幫你買喔！\nB：還好。\nA：我這次去了，可能很久才會再去喔！\nB：就跟你説還好嘛！\n(1)請解釋「嘛」和「嗎」的用法，並說明在什麼情況下才可以用「嘛」。\n(2)設計一組對話包含 5 至 6 個句子，並說明如何引導學習者操練「嘛」的用法。","ref":"","rubric":[]},{"id":"teaching|2023|2","subject":"teaching","yr":"2023","no":2,"pts":15,"q":"語法句型在教學上有幾個階段，如：引入句法階段、說明階段、歸納階段、操練階段等。請就引入句法階段，以華語比較句「A 比 B……」為例，設計 3 種不同的引入方式。","ref":"","rubric":[]},{"id":"linguistics|2023|1","subject":"linguistics","yr":"2023","no":1,"pts":10,"q":"「我跟他去過臺北。」是一個歧義句。請至少寫出三個不同意思的句子，並分析各個句子中「跟」的詞性及功能。","ref":"","rubric":[]},{"id":"linguistics|2023|2","subject":"linguistics","yr":"2023","no":2,"pts":10,"q":"「創作」、「創造」雖被視為同義詞，但二者意思仍有差異，請以動詞用法為例，各搭配\n三例不同的賓語，以說明二詞意義的不同。","ref":"","rubric":[]},{"id":"linguistics|2023|3","subject":"linguistics","yr":"2023","no":3,"pts":10,"q":"請分析下列各句中畫線處的詞類是什麼？並說明他們的用法。\n(1)\n甲、 你想不想吃點什麼？\n乙、 鬧什麼呀！你們越來越不像話了。\n丙、 什麼！你已經五十歲了，實在看不出來。\n(2)\n丁、 這事我疏忽了，怪不得他。\n戊、 原來是寒流到了，怪不得這麼冷。","ref":"","rubric":[]},{"id":"culture|2023|1","subject":"culture","yr":"2023","no":1,"pts":15,"q":"祠堂，又稱宗祠，是華人社會普遍的文化象徵，請問祠堂有何意義與功能？","ref":"","rubric":[]},{"id":"culture|2023|2","subject":"culture","yr":"2023","no":2,"pts":15,"q":"華人社會有以動物為吉祥物的習俗，它們通常各有用途，可適用不同的寓意，請以獅子為例，說明其用途與寓意。","ref":"","rubric":[]},{"id":"teaching|2024|1","subject":"teaching","yr":"2024","no":1,"pts":15,"q":"助詞是一種虛詞，它們附著在詞、詞組或句子後面，有語法功能。下列例句分別出現「了、過、起來」三個助詞，請先說明它們在句子中的語法意義，並進一步分析這三個助詞在教學上應如何掌握區分的特徵。\n(1)媽媽買「了」很多水果\n(2)我兩年沒看電影「了」\n(3)爸爸戴「過」這種帽子\n(4)他站「起來」走出房間\n(5)你今天看「起來」很累","ref":"","rubric":[]},{"id":"teaching|2024|2","subject":"teaching","yr":"2024","no":2,"pts":15,"q":"對於學生華語表達中的錯誤，有兩種不同的主張和做法：一種主張「有錯必糾」，會逐一指出學生的錯誤；一種不同意「有錯必糾」，對學生的錯誤有一定的容忍度。請指出這兩種主張背後的學派並加以評論。","ref":"","rubric":[]},{"id":"linguistics|2024|1","subject":"linguistics","yr":"2024","no":1,"pts":6,"q":"請從語言學的角度分析下列二句之異同。（6 分）\n(1) 你覺得中文難嗎？\n(2) 你覺得中文難不難？","ref":"","rubric":[]},{"id":"linguistics|2024|2","subject":"linguistics","yr":"2024","no":2,"pts":10,"q":"試分析下列各句中副詞「就」、「才」在表意上出現的對立關係，並說明可能隱含的語意差異。（10 分）\n(1) 你七點鐘「就」起床？\n(2) 你七點鐘「才」起床？\n(3) 你一個月「就」能學會？\n(4) 你一個月「才」能學會？\n(5) 吃了三個「就」不吃了？\n(6) 吃了三個「才」不吃了？\n(7) 主任「就」回來，您稍候。\n(8) 主任「才」回來，您稍候。","ref":"","rubric":[]},{"id":"linguistics|2024|3","subject":"linguistics","yr":"2024","no":3,"pts":14,"q":"請分析近義詞「通常」和「常常」在下列句子之異同。（14 分）\n(1) 我「通常/*常常」在家裡吃飯，週末的時候才去外面吃。\n(2) a.公司「通常/常常」星期五下午開會。\nb.公司「*通常/常常」開會。\n(3) a.以前我「*通常/常常」和小明一起吃飯聊天。\nb.以後我一定「*通常/常常」來看您。\n(4)「通常/*常常」我們先去酒吧喝酒，然後再去唱歌。\n(5) 處理這種情況，公司「通常/*常常」的做法是罰款。","ref":"","rubric":[]},{"id":"culture|2024|1","subject":"culture","yr":"2024","no":1,"pts":15,"q":"儒家對生死問題有許多觀察與看法，如《左傳•襄公二十四年》記載晉國范宣子問魯國叔孫豹：\n「古人有言曰：\n『死而不朽』，何謂也？」叔孫豹以「三不朽」\n：立德、立功、立言加以回應。請問「三不朽」的意義內涵為何？從當代的角度來看，「不朽」可以有什麼不同的理解？","ref":"","rubric":[]},{"id":"culture|2024|2","subject":"culture","yr":"2024","no":2,"pts":15,"q":"華人社會的文化表現常常透過節日慶典、飲食習俗、藝術表演等外在形式展現。請選擇\n一個具體的文化活動或習俗，深入分析其背後的內在文化意涵和價值觀，並討論其對全球華人社會的影響及意義。","ref":"","rubric":[]},{"id":"teaching|2025|1","subject":"teaching","yr":"2025","no":1,"pts":15,"q":"請根據下列這段師生課堂對話，闡述其如何體現溝通式語言教學法（Communicative Language Teaching）的交流互動（interaction）原則，並指出對話中教師如何根據學生的回應引出了課文主題相關的平行主題。\n課文主題：學校附近的飯館\n[1]老師：好，我們談完了學校附近的三家餐廳。現在請你告訴我你在美國的大學是在什麼地方？\n[2]學生：我的大學在紐約。\n[3]老師：你是紐約大學的學生嗎？\n[4]學生：不是，我是漢彌爾頓大學的學生。\n[5]老師：漢彌爾頓大學附近也有很多餐廳嗎？\n[6]學生：我不知道。我的大學的城很小，我也不常去餐廳。\n[7]老師：你在漢彌爾頓大學的時候，平常在哪裡吃飯？\n[8]學生：我吃飯在學校的餐廳。\n[9]老師：啊，你在學校的餐廳吃飯。學校的餐廳在哪裡？離你住的地方遠嗎？\n[10]學生：離我住的地方不太遠。\n[11]老師：從你住的地方到餐廳要怎麼走？","ref":"","rubric":[]},{"id":"teaching|2025|2","subject":"teaching","yr":"2025","no":2,"pts":15,"q":"基於理論語法發展而來的教學語法（Pedagogical Grammar）是在關注語法結構的同時，兼顧語義、語用與教學。請由語法結構、語義、語用與教學四個層面，設計存現句「有」\n的教學步驟，並規劃師生問答的操練內容與課堂活動。","ref":"","rubric":[]},{"id":"linguistics|2025|1","subject":"linguistics","yr":"2025","no":1,"pts":8,"q":"請說明「進來」、「進去」、「出來」、「出去」的趨向語義差異。（8 分）","ref":"","rubric":[]},{"id":"linguistics|2025|2","subject":"linguistics","yr":"2025","no":2,"pts":10,"q":"請說明以下兩個句子的語法結構，並分析它們語義差異的原因。（10 分）\n（1）小明去圖書館拿書。\n（2）小明拿書去圖書館。","ref":"","rubric":[]},{"id":"linguistics|2025|3","subject":"linguistics","yr":"2025","no":3,"pts":12,"q":"請分析下列各句中「可以」所表達的情態和語義。（12 分）\n（1）好的蛋白質可以促進身體健康。\n（2）這是訪客的停車格，你可以把車停在這兒，沒問題的。\n（3）我可以游自由式 50 公尺不換氣。","ref":"","rubric":[]},{"id":"culture|2025|1","subject":"culture","yr":"2025","no":1,"pts":15,"q":"漢字不只是華人的語言工具，也承載著歷史與文化。例如：\n「孝」字，上面是「老」的省形，下面是「子」，表示子女背著老人，象徵「承擔與傳承」的孝道文化。請列舉五個漢字，說明其結構與文化意涵。","ref":"","rubric":[]},{"id":"culture|2025|2","subject":"culture","yr":"2025","no":2,"pts":15,"q":"在跨文化華語教學中，文化常被比喻為「冰山」。根據文化冰山理論，華語教師在課堂上除了介紹節慶、美食與服飾等「可見文化」外，更應重視「冰山下」的「非可見文化」\n內容。請舉出三項「非可見文化」的具體例子，並說明其如何影響華人的行為觀念。","ref":"","rubric":[]},{"id":"chinese|2015|1","subject":"chinese","yr":"2015","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪去或將錯誤的地方更正。須加修改之處以括號（ ）標示；修改後的內之後，如下：\n容寫在箭頭\n【例 1】我跟大家介紹一下，這名是李經理。\n答：\n（名）\n位\n【例 2】暑假期間，有許多學生們出國遊學。\n答：\n（們）\n刪除「們」\n1. 案發現場，充斥蔓延著詭譎的氣氛。\n2. 我不禁忍不住笑了起來。\n3. 她的身體太過懦弱，無法負荷這樣勞累的工作。\n4. 聽說臺灣是個寶島，我不曾經去過那裡。\n5. 這對年輕父母要外出旅遊，所以暫時把小孩托孤給鄰居。\n（請轉背面）\n（第 4 頁，共 4 頁）","ref":"","rubric":[]},{"id":"chinese|2015|2","subject":"chinese","yr":"2015","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯：請將下列文字譯成白話（20 分）\n雖有嘉肴，弗食，不知其旨也；雖有至道，弗學，不知其善也。故學然後知不足，教然後知困。知不足，然後能自反也；知困，然後能自強也，故曰：教學相長也。\n〈兌命〉曰：\n「學（斅）學半。」其此之謂乎！（《禮記．學記》）","ref":"","rubric":[]},{"id":"chinese|2015|3","subject":"chinese","yr":"2015","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分；文長限 400 至 600 字，須分段並加標點符號，不得以詩歌形式寫作）\n即將成為華語教師的你，在臺灣這塊土地上，什麼風景最讓你戀戀難忘？什麼節慶最讓你載欣載奔？什麼樣的人物最讓你感懷在心？請以「在地的感動」為題，作文一篇。","ref":"","rubric":[]},{"id":"chinese|2016|1","subject":"chinese","yr":"2016","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪去或將錯誤的地方更正。須加修改之處以括號（ ）標示；修改後的內容寫在箭頭之後，如下：\n【例 1】我跟大家介紹一下，這名是李經理。\n答：（名）\n位\n【例 2】暑假期間，有許多學生們出國遊學。\n答：（們）\n刪除「們」\n1. 我的腳踏車壞了，你能幫我用嗎？\n2. 他在狂風暴雨中奪門而出，一邊跑一邊哭，臉上分不清是雨珠還是淚珠。\n3. 我從小就喜歡吹口琴，而且吹得很不好。\n4. 圖書館內靜悄悄的沒有一個人，只有她在看書。\n5. 去年八月底我跟幾個朋友們一起去看過那些可憐的災民。\n（請轉背面）\n（第 4 頁，共 4 頁）","ref":"","rubric":[]},{"id":"chinese|2016|2","subject":"chinese","yr":"2016","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯：請將下列文字譯成白話（20 分）\n初極狹，纔通人；復行數十步，豁然開朗。土地平曠，屋舍儼然。有良田、美池、桑、竹之屬，阡陌交通，雞犬相聞。其中往來種作，男女衣著，悉如外人；黃髮垂髫，並怡然自樂。(陶潛〈桃花源記〉)","ref":"","rubric":[]},{"id":"chinese|2016|3","subject":"chinese","yr":"2016","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分；文長限 400-600 字，文言、白話不拘，但須分段，並加新式標點。不得以詩歌、書信體裁寫作，違者不計分。）\n如果你是位華語教師，怎樣讓外國人認識臺灣，營造出一個具有臺灣特色的華語教學環境，以吸引外國人來臺灣學習？請以「營造臺灣特色的華語教學」為題，寫一篇文章。","ref":"","rubric":[]},{"id":"chinese|2017|1","subject":"chinese","yr":"2017","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪去或將錯誤的地方更正，須加修改之處以括號（）標示；修改後的內容寫在箭頭之後，示例如下：\n【例 1】我跟大家介紹一下，這名是李經理。\n答：（名）\n位\n【例 2】暑假期間，有許多學生們出國遊學。\n答：（們）\n刪除「們」\n1. 消基會揭發不法商人仿造偽劣產品於市面上販售。\n2. 王華是一位教學認真，對學生循循善誘，非常值得敬佩。\n3. 李導演擅長開發演員隱藏的表演潛力。\n4. 這箱東西太重了，我一個人不能拿得起來。\n5. 他五歲時，父親就教他射一支箭，六歲就教他騎一匹馬。","ref":"","rubric":[]},{"id":"chinese|2017|2","subject":"chinese","yr":"2017","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯：請將下列原文譯成語體文（20 分）\n宋人有耕者，田中有株，兔走觸株，折頸而死，因釋其耒而守株，冀復得兔。兔不可復得，而身為宋國笑。\n《韓非子•五蠹》","ref":"","rubric":[]},{"id":"chinese|2017|3","subject":"chinese","yr":"2017","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分；文長限 400-600 字，文言、白話不拘，但須分段，並加新式標點。不得以詩歌、書信體裁寫作，違者不予計分。）\n寫作題目：夜市遊記","ref":"","rubric":[]},{"id":"chinese|2018|1","subject":"chinese","yr":"2018","no":1,"label":"病句修改","pts":10,"q":"病句修改(每題 2 分，共 10 分)\n請將多餘的字刪去或將錯誤的地方更正，須加修改之處以括號()標示；修改後的內容寫在箭頭之後，示例如下：\n【例 1】我跟大家介紹一下，這名是李經理。\n答：(名)\n位\n【例 2】暑假期間，有許多學生們出國遊學。\n答：(們)\n刪除「們」\n1. 他各自回家去了。\n2. 遠方的燈塔，這是夜行者的希望。\n3. 一切任何困難都打不倒我們。\n4. 春天的時候，花園裡百花齊放，只有一棵松樹靜靜的長在花園的角落，顯得看起來毫不起眼。\n5. 他爸爸五歲的時候就去世了，全靠母親撫養長大。","ref":"","rubric":[]},{"id":"chinese|2018|2","subject":"chinese","yr":"2018","no":2,"label":"文言文翻譯","pts":20,"q":"語譯(20 分。請將下列原文譯成語體文)\n子貢問政。子曰：「足食，足兵，民信之矣。」子貢曰：「必不得已而去，於斯三者何先？」曰：\n「去兵。」子貢曰：\n「必不得已而去，於斯二者何先？」曰：\n「去食。自古皆有死，民無信不立。」\n《論語・顏淵第十二》","ref":"","rubric":[]},{"id":"chinese|2018|3","subject":"chinese","yr":"2018","no":3,"label":"作文","pts":30,"q":"短文寫作(30 分。文長限 400-600 字，文言、語體不拘，但須分段，並加新式標點。不得以詩歌、書信體裁寫作，違者不予計分。)\n漢字難學，是對外華語教學所面臨的第一道瓶頸，如何讓漢字可以系統化的理解，而不必死背，是身為華語專業教師所必須具備的條件。請以「我的漢字教學策略」為題，寫一篇短文。","ref":"","rubric":[]},{"id":"chinese|2019|1","subject":"chinese","yr":"2019","no":1,"label":"病句修改","pts":10,"q":"病句修改(每題 2 分，共 10 分)\n請將多餘的字刪去或將錯誤的地方更正，須加修改之處以括號()標示；修改後的內容寫在箭頭之後，示例如下：\n【例 1】我跟大家介紹一下，這名是李經理。\n答：(名)\n位\n【例 2】暑假期間，有許多學生們出國遊學。\n答：(們)\n刪除「們」\n1. 王先生細說臺北故宮博物院所收藏的文物如數家珍，左右逢源，令在場的專家佩服不已。\n2. 我以後想當一位華語教師在國外。\n3. 黃昏時刻，騎著腳踏車在河邊信步奔馳，真是一大享受。\n4. 我估計他肯定完全不了解事情的真象，所以才會有這麼曲折離奇的反應。\n5. 突然，草叢旁竄出一條蛇，我嚇到呼吸簡直幾乎要停下來了。","ref":"","rubric":[]},{"id":"chinese|2019|2","subject":"chinese","yr":"2019","no":2,"label":"文言文翻譯","pts":20,"q":"語譯(20 分。請將下列原文譯成語體文)\n吾嘗終日而思矣，不如須臾之所學也。吾嘗跂而望矣，不如登高之博見也。登高而招，臂非加長也，而見者遠；順風而呼，聲非加疾也，而聞者彰。假輿馬者，非利足也，而致千里；假舟楫者，非能水也，而絕江河。君子生非異也，善假於物也。\n（《荀子．勸學》）","ref":"","rubric":[]},{"id":"chinese|2019|3","subject":"chinese","yr":"2019","no":3,"label":"作文","pts":30,"q":"短文寫作(30 分。文長限 400-600 字，文言、語體不拘，但須分段，並加新式標點。不得以詩歌、書信體裁寫作，違者不予計分。)\n作家鄭清文曾在國立臺灣大學洪游勉文學講座中說：\n「站在山底下看，山都是高的，站在山腰看，山有高有低，站得越高，世界越大，可看到的東西越多，『批評』就是培養走向山腰、走向山頂能力。」\n（2008 年 11 月）這段話原是談寫作與批評的關係，其實也可以和人生有關，請就此申論個人觀點。","ref":"","rubric":[]},{"id":"chinese|2020|1","subject":"chinese","yr":"2020","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪除如【例1】，或將錯誤的地方更正如【例2】，並以括號（）標示修改之處。\n【例1】暑假期間，有許多學生們出國遊學。\n答：（們）→刪除「們」\n【例2】我跟大家介紹一下，這名是李經理。\n答：（名）→位\n1. 聽了正崴的說明，我在心裡真是由衷的感謝李芳。\n2. 這輛車子不但新，但是價錢不貴。\n3. 夜深人靜，想起今天一連串發生的事情，我怎麼也睡不著。\n4. 我斷定他下個禮拜天可能會回來。\n5. 他多次反復練習，希望能在比賽中脫穎而出。","ref":"","rubric":[]},{"id":"chinese|2020|2","subject":"chinese","yr":"2020","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯（20 分。請將下列原文譯成語體文）\n某生夜讀，往復數百遍，猶不熟。漏四下，誦聲益喧，意且達旦矣。有賊伏床下，躁甚，突起摑之曰：「爾非生鐵，何頑頓若此！余焉能待！」遽驅出門，鼓掌而去。\n（獨逸窩退士《笑笑錄．偷兒》）","ref":"","rubric":[]},{"id":"chinese|2020|3","subject":"chinese","yr":"2020","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分。文長限 400-600 字，文言、語體不拘，但須分段，並加新式標點）\n華語文教學中，你認為最困難和最有趣的地方是什麼？你有哪些方法可以讓他們快快樂樂地學好華語？請自訂一個題目，談談你的想法。","ref":"","rubric":[]},{"id":"chinese|2021|1","subject":"chinese","yr":"2021","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪除如【例1】，或將錯誤的地方更正如【例2】，並以括號（）標示修改之處。\n【例1】暑假期間，有許多學生們出國遊學。\n答：（們）→刪除「們」\n【例2】我跟大家介紹一下，這名是李經理。\n答：（名）→位\n1. 我覺得暗地裡冥冥中好像有人在跟蹤。\n2. 他說有事，這是推辭，但是未必真正有事。\n3. 王老師教文學，也歷史。他退休了。\n4. 我的朋友是法國的人，他說他每周看了一電影。\n5. 小華逗趣的表演，讓同學們忍俊不禁的笑了出來。","ref":"","rubric":[]},{"id":"chinese|2021|2","subject":"chinese","yr":"2021","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯（每題 10 分，共 20 分。請將下列原文譯成白話文）\n1. 夫學須靜也，才須學也。非學無以廣才，非志無以成學。（諸葛亮‧〈誡子書〉）\n2. 君子防未然，不處嫌疑間。瓜田不納履，李下不正冠。（樂府歌辭）","ref":"","rubric":[]},{"id":"chinese|2021|3","subject":"chinese","yr":"2021","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分。請以通行之散文體寫作，文長在 400-600 字之間，須分段，並加標點符號。）\n題目：我想當一位華語教師人生有許多轉折，也許原本想進企業界，卻走上了教育路；也許本來想自行創業，卻又轉回來想當教師。請敘寫你為何踏上華語教師之路。","ref":"","rubric":[]},{"id":"chinese|2022|1","subject":"chinese","yr":"2022","no":1,"label":"病句修改","pts":10,"q":"病句修改（共 10 分，每題至少 1 個錯誤）\n請將錯誤的地方更正如【例1】、【例2】、【例3】，並以（ ）標示修改之處。\n【例1】暑假期間，有許多學生們出國遊學。\n答：（們）→刪除「們」\n【例2】我跟大家介紹一下，這名是李經理。\n答：（名）→位\n【例3】我到圖書館看書，晚上。\n答：（晚上）→移至句首\n1. 他實在太超過了，這樣賺錢亂亂花。\n2. 我想要去散一個步，到公園裡，今天下午。\n3. 他固然是個外國人，反而卻能說一口流利的華語。\n4. 要想瘦下來也不能不吃東西啊！如果你再這樣下去，就能得病的。\n5. 防疫期間，雖然只是短短幾天的「居家阻隔」，卻使人有不如歸去的感覺。","ref":"","rubric":[]},{"id":"chinese|2022|2","subject":"chinese","yr":"2022","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯（每題 10 分，共 20 分。請將下列原文譯成白話文）\n1. 吾見世人，清名登而金貝入，信譽顯而然諾虧，不知後之矛戟，毀前之干櫓也。\n（《顏氏家訓‧名實篇》）\n2. 性猶湍水也，決諸東方則東流，決諸西方則西流。人性之無分於善不善也，猶水之無分於東西也。（《孟子‧告子》）","ref":"","rubric":[]},{"id":"chinese|2022|3","subject":"chinese","yr":"2022","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分。請抄題目，並以通行之散文體寫作，文長在 400-600 字之間，須分段並加標點符號。）\n教育學者福祿貝爾（Friedrich Froebel）曾說：「教育無他，唯愛與榜樣而已」。對外華語教學必須面對五花八門的難題，身為專業的華語教師，也應該有不少的個人經歷，或是值得分享的心得，請以「從愛與榜樣出發」為題，寫一篇短文。","ref":"","rubric":[]},{"id":"chinese|2023|1","subject":"chinese","yr":"2023","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪除如【例1】，或將錯誤的地方更正如【例2】，並以括號（）標示修改之處。\n【例1】暑假期間，有許多學生們出國遊學。答：（們）→刪除「們」\n【例2】我跟大家介紹一下，這名是李經理。答：（名）→位\n1. 山城的土產招牌充斥著鄉野的生命力和生活的興味。\n2. 說說要來載我的，你怎麼突然有事來了呢？\n3. 這個負面壞消息對他來說，無疑又是一次重大的重擊。\n4. 這家服飾店大特價，我昨天買了一件，明天還想又去買一件。\n5. 我仔細檢查考卷，並改進其中的錯誤。","ref":"","rubric":[]},{"id":"chinese|2023|2","subject":"chinese","yr":"2023","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯（20 分。請將下列原文譯成白話文）\n玉不琢，不成器；人不學，不知道。然玉之為物，有不變之常德，雖不琢以為器，而猶不害為玉也。人之性，因物則遷，不學，則舍君子而為小人，可不念哉？（歐陽修〈誨學〉）","ref":"","rubric":[]},{"id":"chinese|2023|3","subject":"chinese","yr":"2023","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分。請以通行之散文體寫作，文長在 400-600 字之間，須分段，並加標點符號。）\n題目：我心目中優質的華語教師累積大量相關知能後，相信您已對華語教師的身分，有著不同於一般人的深刻認識。\n請您站在這個立場上，結合以往經驗、見聞，談談心目中「優質」的華語教師。\n（文中請勿出現姓名及其他暗示語言，否則扣除本題成績 10 分。）","ref":"","rubric":[]},{"id":"chinese|2024|1","subject":"chinese","yr":"2024","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪除如【例1】，或將錯誤的地方更正如【例2】，並以括號（）標示修改之處。\n【例1】暑假期間，有許多學生們出國遊學。答：（們）→刪除「們」\n【例2】我跟大家介紹一下，這名是李經理。答：（名）→位\n1. 今天有不少很豐盛的菜餚，你可以吃多一點。\n2. 老張活著五十多年，沒見過像小王這樣的人事。\n3. 我們都當時是剛上大學的學生，沒有工作的任何經驗。\n4. 兩個人在一起，遇到事至少可以商量商量一下，總比一個人好太多。\n5. 你知道要多說中文才能進步，你偏偏會說英文，你怎麼進步你的中文能力？","ref":"","rubric":[]},{"id":"chinese|2024|2","subject":"chinese","yr":"2024","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯（每題 10 分，共 20 分。請將下列原文譯成白話文）\n1. 世有伯樂，然後有千里馬。千里馬常有，而伯樂不常有。故雖有名馬，秖辱於奴隸人之手，駢死於槽櫪之間，不以千里稱也。（韓愈〈雜說〉）\n2. 凡物皆有可觀，苟有可觀，皆有可樂，非必怪奇偉麗者也。餔糟啜醨，皆可以醉；果蔬草木，皆可以飽。推此類也，吾安往而不樂？（蘇軾〈超然臺記〉）","ref":"","rubric":[]},{"id":"chinese|2024|3","subject":"chinese","yr":"2024","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分。請抄題目，並以通行之散文體寫作，文長在 400-600 字之間，須分段，並加標點符號。）\n題目：華語教學最美的風景說明：關於華語教學，你有沒有相關的經驗或觀察？這些經驗或觀察是否給你留下深刻美好的印象或畫面？這些印象中，最難忘、最美好的畫面是什麼？請以「華語教學最美的風景」為題，寫一篇短文分享你的想法。\n（文中請勿出現姓名以及其他足以辨識身分之文字，否則酌予扣分）","ref":"","rubric":[]},{"id":"chinese|2025|1","subject":"chinese","yr":"2025","no":1,"label":"病句修改","pts":10,"q":"病句修改（每題 2 分，共 10 分）\n請將多餘的字刪除如【例1】，或將錯誤的地方更正如【例2】，並以括號（）標示修改之處。\n【例1】暑假期間，有許多學生們出國遊學。答：（們）→刪除「們」\n【例2】我跟大家說明一下，這名是李經理。答：（說明）→介紹、（名）→位\n1. 這對兩個孿生兄弟，真的長得一模模一樣樣。\n2. 這種錯誤實在很要不得，必須馬上立即改進。\n3. 因為民眾都施打了疫苗，所以健康和確診就有保障。\n4. 雖然忘了帶隻傘，我被大雨淋得渾身濕透。\n5. 我把作業沒交上去。","ref":"","rubric":[]},{"id":"chinese|2025|2","subject":"chinese","yr":"2025","no":2,"label":"文言文翻譯","pts":20,"q":"翻譯（每題 10 分，共 20 分。請將下列原文譯成白話文）\n1. 木受繩則直，金就礪則利，君子博學而日三省乎己，則知明而行無過矣。（《荀子‧勸學》）\n2. 君子惠而不費，勞而不怨，欲而不貪，泰而不驕，威而不猛。（《論語‧堯曰》）","ref":"","rubric":[]},{"id":"chinese|2025|3","subject":"chinese","yr":"2025","no":3,"label":"作文","pts":30,"q":"短文寫作（30 分。請抄題目，並以通行之散文體寫作，文長在 400-600 字之間，須分段，並加標點符號）\n題目：AI 時代的華語教學策略與挑戰\n（文中請勿出現姓名及其他暗示語言，否則扣除該科目成績 20 分或其全部分數）","ref":"","rubric":[]}];

const esT = x => { const d=new Date(x||0); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const esNL = v => esc(v||'').replace(/\n/g,'<br>');
async function loadEssayAdmin(){

function esSetMode(m){ _esMode=m; renderEssayAdmin(); }

const esQ = id => (_esBank||[]).find(e=>e.id===id);
function renderEssayAdmin(){
  const el=document.getElementById('essay-list'); if(!el||!_esBank) return;
  const nW=_esSubs.filter(s=>s.status==='submitted').length, nG=_esSubs.filter(s=>s.status==='graded').length, nS=_esSubs.filter(s=>s.status==='self').length;

  const seg=document.getElementById('essay-seg');

  if(_esMode==='bank'){ el.innerHTML=renderEssayBank(); return; }

  if(!list.length){ el.innerHTML='<div class="card qb-empty"><div class="qb-empty-sub" style="margin:0">'+({wait:'目前沒有待批改的回答。',graded:'還沒有批改過的回答。',self:'還沒有學生自評紀錄。'})[_esMode]+'</div></div>'; return; }
  el.innerHTML=list.map(renderEssaySub).join('');
}
function renderEssaySub(s){
  const q=esQ(s.essayId)||{rubric:[],ref:''}; const rub=q.rubric||[]; const open=!!_esOpen[s.id] || _esMode==='wait';
  const checks = Array.isArray(s.teacherChecks) ? s.teacherChecks : (Array.isArray(s.selfChecks)&&_esMode!=='self' ? [] : []);
  let h='<div class="card es-card">'
    +'<div class="es-card-head" onclick="esToggle(\''+s.id+'\')"><div><b>'+esc(s.name||'')+'</b>'+(s.account&&s.account!==s.name?'<span class="es-acc">（帳號 '+esc(s.account)+'）</span>':'')
    +'<div class="es-sub">'+esc(ES_SN[s.subject]||'')+' '+esc(s.yr)+' 年'+esc(s.label?'・'+s.label:'第 '+s.no+' 題')+'・'+(s.pts||'')+' 分・'+(s.status==='self'?'自評於 ':'送出於 ')+esT(s.submittedAt||s.createdAt)+'</div></div>'
    +'<div class="es-right">'+(s.status==='graded'?'<span class="chip ok">已批改 '+s.teacherScore+'／'+(s.pts||'')+'</span>':s.status==='self'?'<span class="chip info">自評 '+(s.selfScore!=null?s.selfScore:'—')+'／'+(s.pts||'')+'</span>':'<span class="chip warn">待批改</span>')+'</div></div>';
  if(open){
    h+='<div class="es-sec">題目</div><div class="es-box q">'+esNL(s.question||q.q)+'</div>'
      +'<div class="es-sec">學生回答　<small>'+String(s.answer||'').length+' 字</small></div><div class="es-box">'+esNL(s.answer)+'</div>';
    if(s.status==='self'){
      if(rub.length && Array.isArray(s.selfChecks)) h+='<div class="es-sec">學生自評</div><div class="es-rub">'+rub.map((r,i)=>'<div class="es-rrow'+(s.selfChecks[i]?' on':'')+'"><span class="es-mk">'+(s.selfChecks[i]?'✓':'—')+'</span><span>'+esNL(r.text)+'</span><b>'+(r.pts||0)+' 分</b></div>').join('')+'</div>';
    } else {
      h+='<div class="es-sec">批改</div>';
      if(rub.length) h+='<div class="es-rub">'+rub.map((r,i)=>'<label class="es-rrow"><input type="checkbox" data-sid="'+s.id+'" data-i="'+i+'" '+(checks[i]?'checked':'')+' onchange="esRecalc(\''+s.id+'\')"><span>'+esNL(r.text)+'</span><b>'+(r.pts||0)+' 分</b></label>').join('')+'</div>';
      else h+='<div class="es-tip">這一題還沒有評分要點，可以直接給分。到「題目與評分標準」可以新增。</div>';
      if(Array.isArray(s.selfChecks) && s.selfScore!=null) h+='<div class="es-tip">學生送出前自評：'+s.selfScore+' 分</div>';
      h+='<div class="es-grade"><label>得分 <input type="number" min="0" max="'+(s.pts||100)+'" id="es-score-'+s.id+'" value="'+(s.teacherScore!=null?s.teacherScore:'')+'"> ／ '+(s.pts||'')+' 分</label></div>'
        +'<textarea class="es-cmt" id="es-cmt-'+s.id+'" placeholder="給學生的評語（學生看得到）">'+esc(s.teacherComment||'')+'</textarea>'
        +'<div class="es-btns"><span class="es-msg" id="es-msg-'+s.id+'"></span><button class="btn btn-primary" onclick="esSaveGrade(\''+s.id+'\')">'+(s.status==='graded'?'更新批改':'完成批改')+'</button></div>';
      if(q.ref) h+='<details class="es-refd"><summary>看參考答案</summary><div class="es-box ref">'+esNL(q.ref)+'</div></details>';
    }
  }
  return h+'</div>';
}
function esToggle(id){ _esOpen[id]=!_esOpen[id]; renderEssayAdmin(); }
function esRecalc(id){
  const s=_esSubs.find(x=>x.id===id); const q=esQ(s.essayId)||{rubric:[]};
  let t=0; document.querySelectorAll('input[data-sid="'+id+'"]').forEach(cb=>{ if(cb.checked) t+=Number((q.rubric[+cb.dataset.i]||{}).pts)||0; });
  const sc=document.getElementById('es-score-'+id); if(sc) sc.value=t;
}
async function esSaveGrade(id){
  const s=_esSubs.find(x=>x.id===id); const q=esQ(s.essayId)||{rubric:[]};
  const scEl=document.getElementById('es-score-'+id), msg=document.getElementById('es-msg-'+id);
  const sc=Number(scEl.value); if(scEl.value==='' || isNaN(sc) || sc<0 || sc>(s.pts||1000)){ msg.textContent='請輸入 0～'+(s.pts||'')+' 的分數'; return; }
  const checks=(q.rubric||[]).map((r,i)=>{ const cb=document.querySelector('input[data-sid="'+id+'"][data-i="'+i+'"]'); return !!(cb&&cb.checked); });
  msg.textContent='儲存中…';
  try{ await _db.collection('essaySubs').doc(id).update({teacherScore:sc, teacherChecks:checks, teacherComment:document.getElementById('es-cmt-'+id).value.trim(), status:'graded', gradedAt:Date.now(), gradedBy:(auth.currentUser&&auth.currentUser.email)||''}); msg.textContent='已儲存'; }
  catch(e){ console.warn(e); msg.textContent='儲存失敗：'+(e.message||e); }
}
// ── 題目與評分標準 ──
function renderEssayBank(){
  const isM=_currentRole==='master';
  let h='<div class="seg" style="grid-template-columns:repeat(4,1fr);max-width:720px">'+ES_ORDER.map(k=>'<button type="button" class="seg-btn'+(_esSubj===k?' active':'')+'" onclick="esSetSubj(\''+k+'\')">'+ES_SN[k]+'<span class="seg-n">'+_esBank.filter(e=>e.subject===k).length+'</span></button>').join('')+'</div>';
  h+='<div class="es-tip" style="margin:0 0 10px">題目文字是從教育部考卷 PDF 自動擷取，請順便檢查。參考答案和評分要點寫好後，學生就能自評；評分要點的分數加起來最好等於配分。'+(isM?'':'（只有主管理員能修改）')+'</div>';
  if(isM) h+='<div class="es-btns" style="justify-content:flex-start;margin:0 0 10px"><button class="btn btn-secondary" onclick="esNewQ()">＋ 新增題目</button></div>';
  const items=_esBank.filter(e=>e.subject===_esSubj).sort((a,b)=>(b.yr.localeCompare(a.yr))||(a.no-b.no));
  h+=items.map(q=>{
    const rs=(q.rubric||[]).reduce((a,r)=>a+(Number(r.pts)||0),0), ready=!!(q.ref||(q.rubric||[]).length);
    if(_esEditId===q.id) return renderEssayEditor();
    return '<div class="card es-bank"><div class="es-card-head"><div><b>'+esc(q.yr)+' 年'+esc(q.label?'・'+q.label:'第 '+q.no+' 題')+'</b><span class="es-acc">'+(q.pts||0)+' 分</span><div class="es-sub">'+esc(String(String(q.q).split('\n')[q.label?1:0]||'')).slice(0,90)+'</div></div>'
      +'<div class="es-right">'+(ready?'<span class="chip ok">已有評分要點 '+(q.rubric||[]).length+' 項'+(rs&&rs!==q.pts?'（合計 '+rs+' 分）':'')+'</span>':'<span class="chip warn">尚未準備</span>')+(isM?'<button class="btn btn-secondary" onclick="esEditQ(\''+esc(q.id)+'\')">編輯</button>':'')+'</div></div></div>';
  }).join('');
  return h;
}
function esEditQ(id){ _esEditId=id; const q=esQ(id); if(q) _esSubj=q.subject; _esDraft=JSON.parse(JSON.stringify(q)); if(!_esDraft.rubric) _esDraft.rubric=[]; renderEssayAdmin(); }
function esNewQ(){ const yr=prompt('年份（例如 2026）'); if(!yr) return; const no=parseInt(prompt('第幾題（數字）')||'',10); if(!no) return;
  const id=_esSubj+'|'+yr.trim()+'|'+no; if(esQ(id)){ alert('這一題已經存在'); return; }
  _esBank.push({id, subject:_esSubj, yr:yr.trim(), no, pts:10, q:'', ref:'', rubric:[]}); esEditQ(id); }
function renderEssayEditor(){
  const d=_esDraft, rs=d.rubric.reduce((a,r)=>a+(Number(r.pts)||0),0);
  return '<div class="card es-edit"><div class="es-card-head"><b>'+esc(d.yr)+' 年'+esc(d.label?'・'+d.label:'第 '+d.no+' 題')+'（'+ES_SN[d.subject]+'）</b></div>'
    +'<div class="es-sec">題目</div><textarea class="es-ta" rows="5" oninput="_esDraft.q=this.value">'+esc(d.q)+'</textarea>'
    +'<div class="es-sec">配分 <input type="number" class="es-num" min="0" value="'+(d.pts||0)+'" oninput="_esDraft.pts=Number(this.value)||0"> 分</div>'
    +'<div class="es-sec">參考答案</div><textarea class="es-ta" rows="7" placeholder="寫給學生看的參考答案" oninput="_esDraft.ref=this.value">'+esc(d.ref||'')+'</textarea>'
    +'<div class="es-sec">評分要點　<small>目前合計 '+rs+' 分'+(rs!==d.pts?'，配分是 '+d.pts+' 分':'')+'</small></div>'
    +d.rubric.map((r,i)=>'<div class="es-rbe"><textarea rows="2" placeholder="例如：說明演繹式是先給規則再練習" oninput="_esDraft.rubric['+i+'].text=this.value">'+esc(r.text||'')+'</textarea><input type="number" class="es-num" min="0" value="'+(r.pts||0)+'" oninput="_esDraft.rubric['+i+'].pts=Number(this.value)||0"><span>分</span><button class="btn btn-danger" onclick="_esDraft.rubric.splice('+i+',1);renderEssayAdmin()">刪除</button></div>').join('')
    +'<button class="btn btn-secondary" onclick="_esDraft.rubric.push({text:\'\',pts:0});renderEssayAdmin()">＋ 新增評分要點</button>'
    +'<div class="es-btns"><span class="es-msg" id="es-bank-msg"></span><button class="btn btn-secondary" onclick="esCancelEdit()">取消</button><button class="btn btn-primary" onclick="esSaveQ()">儲存</button></div></div>';
}
function esCancelEdit(){ const q=esQ(_esEditId); if(q && !q.q && !q.ref && !(q.rubric||[]).length && !_esDraft.q) _esBank=_esBank.filter(e=>e!==q); _esEditId=null; _esDraft=null; renderEssayAdmin(); }
async function esSaveQ(){
  const msg=document.getElementById('es-bank-msg'); const d=_esDraft;
  d.rubric=d.rubric.filter(r=>String(r.text||'').trim()).map(r=>({text:String(r.text).trim(), pts:Number(r.pts)||0}));
  if(!String(d.q||'').trim()){ msg.textContent='題目不能空白'; return; }
  const next=_esBank.map(e=>e.id===d.id?d:e);
  msg.textContent='儲存中…';
  try{ await _db.collection('essaybank').doc('all').set({items:next, updatedAt:Date.now()}); _esBank=next; _esEditId=null; _esDraft=null; renderEssayAdmin(); }
  catch(e){ console.warn(e); msg.textContent='儲存失敗：'+(e.message||e); }
}
</script>

<script>
// ═══ 研究資料（v3.28）：使用紀錄摘要、去識別化匯出 Excel ═══
let _rsData = null;
async function loadResearch(force){
  const el=document.getElementById('research-body'); if(!el) return;
  if(_rsData && !force){ renderResearch(); return; }
  el.innerHTML='<div class="card qb-empty"><div class="qb-empty-sub" style="margin:0">讀取中…</div></div>';
  const get = async (ref, name) => { try{ const s=await ref.get(); return s.docs.map(d=>Object.assign({_id:d.id}, d.data())); }catch(e){ console.warn(name, e); return []; } };
  const [recs, users, essays, usage, guests] = await Promise.all([
    get(_db.collection('config').doc('examHistory').collection('records'), 'records'),
    get(_db.collection('users'), 'users'),
    get(_db.collection('essaySubs'), 'essaySubs'),
    get(_db.collection('usageLog'), 'usageLog'),
    get(_db.collection('config').doc('guestHistory').collection('records'), 'guestHistory')]);
  _rsData = {recs, users, essays, usage, guests, at:Date.now()};
  renderResearch();
}
function _rsCodes(){
  // 依第一次出現的時間編代號：學習者 P001、訪客 G001；用 uid（或帳號名）對應，不輸出姓名與信箱
  const d=_rsData, first={}, seen=(k,t)=>{ if(!k) return; if(!(k in first) || (t||0)<first[k]) first[k]=t||0; };
  const ukey = x => x.uid ? 'u:'+x.uid : (x.name ? 'n:'+x.name : (x.account ? 'n:'+x.account : null));
  const nameToUid = {}; d.users.forEach(u=>{ if(u.uid) nameToUid[u.name||u._id]=u.uid; });
  const key = x => { if(x.uid) return 'u:'+x.uid; const nm=x.account||x.name; if(nm && nameToUid[nm]) return 'u:'+nameToUid[nm]; return nm?'n:'+nm:null; };
  d.users.forEach(u=>seen(key(Object.assign({}, u, {name:u.name||u._id})), Date.parse(u.createdAt||'')||0));
  d.recs.forEach(r=>seen(key(r), r.startedAt||Date.parse((r.date||'')+'T'+(r.time||'00:00'))||0));
  d.essays.forEach(e=>seen(key(e), e.createdAt));
  d.usage.forEach(u=>{ if(u.uid) seen('u:'+u.uid, u.at); });
  const order=Object.keys(first).sort((a,b)=>first[a]-first[b]);
  const map={}; order.forEach((k,i)=>map[k]='P'+String(i+1).padStart(3,'0'));
  const gmap={}; let gi=0; d.usage.filter(u=>u.gid).sort((a,b)=>a.at-b.at).forEach(u=>{ if(!gmap[u.gid]) gmap[u.gid]='G'+String(++gi).padStart(3,'0'); });
  return {code:x=>map[key(x)]||'', gcode:g=>gmap[g]||'', map, gmap, key, nameToUid};
}
function renderResearch(){
  const el=document.getElementById('research-body'); const d=_rsData; if(!el||!d) return;
  const C=_rsCodes();
  const timed=d.recs.filter(r=>r.activeSec!=null);
  const avgSec=timed.length?Math.round(timed.reduce((a,r)=>a+r.activeSec,0)/timed.length):null;
  const sessions=new Set(d.usage.map(u=>u.sid)).size;
  const mob=d.usage.filter(u=>u.event==='visit'&&u.dev==='mobile').length, vis=d.usage.filter(u=>u.event==='visit').length;
  const evc={}; d.usage.forEach(u=>{ evc[u.event]=(evc[u.event]||0)+1; });
  const EVN={visit:'打開網站',login:'登入',guest_start:'訪客試做',exam_start:'開始測驗',exam_finish:'交卷',exam_leave_noanswer:'沒作答就離開',review_start:'錯題複習',review_finish:'完成錯題複習',open:'打開頁面',download_pdf:'下載 PDF',share_result:'分享成績',leave:'離開網站'};
  const fmtS=s=>s==null?'—':(Math.floor(s/60)?Math.floor(s/60)+' 分 ':'')+(s%60)+' 秒';
  let h='<div class="card rs-card"><div class="gm-head">'
    +'<div><div class="gm-big">'+Object.keys(C.map).length+' <small>人</small></div><div class="gm-lbl">參與者（學習者）</div></div>'
    +'<div><div class="gm-big">'+d.recs.length+' <small>次</small></div><div class="gm-lbl">考試紀錄・有計時 '+timed.length+' 次</div></div>'
    +'<div><div class="gm-big">'+fmtS(avgSec)+'</div><div class="gm-lbl">平均實際作答時間</div></div>'
    +'<div><div class="gm-big">'+sessions+' <small>次</small></div><div class="gm-lbl">使用工作階段・手機 '+(vis?Math.round(mob/vis*100):0)+'%</div></div>'
    +'</div><div class="rs-ev">'+Object.keys(evc).sort((a,b)=>evc[b]-evc[a]).map(k=>'<span class="chip info">'+esc(EVN[k]||k)+' '+evc[k]+'</span>').join('')+'</div>'
    +'<div class="es-tip">作答時間、使用紀錄從 v3.28 上線後才開始記錄；之前的考試紀錄沒有時間資料。讀取時間：'+new Date(d.at).toLocaleString('zh-TW')+'　<button class="ab-hist-btn" onclick="loadResearch(true)">重新讀取</button></div></div>';
  h+='<div class="card rs-card"><div class="rg-title">匯出研究資料（去識別化）</div>'
    +'<div class="es-tip" style="margin-top:0">匯出成一個 Excel 檔，學習者以 P001、P002…、訪客以 G001… 代號表示，不含姓名、帳號、信箱。內含工作表：說明、參與者、考試紀錄、逐題作答、問答題、使用紀錄。</div>'
    +'<div class="rs-opts"><label><input type="checkbox" id="rs-essay-text" checked> 問答題包含學生的回答內容</label><label>日期範圍 <input type="date" id="rs-from"> 到 <input type="date" id="rs-to"></label></div>'
    +'<div class="es-btns" style="justify-content:flex-start"><button class="btn btn-primary" onclick="exportResearch()">匯出 Excel</button>'
    +(_currentRole==='master'?'<button class="btn btn-secondary" onclick="exportCodeMap()">匯出代號對照表（含姓名，請勿外流）</button>':'')
    +'<span class="es-msg" id="rs-msg"></span></div></div>';
  el.innerHTML=h;
}
function _rsLoadXLSX(){
  return new Promise((ok,no)=>{ if(window.XLSX) return ok(); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=ok; s.onerror=()=>no(new Error('無法載入 Excel 元件')); document.head.appendChild(s); });
}
const _rsSN={chinese:'國文',culture:'華人社會與文化',linguistics:'漢語語言學',teaching:'華語文教學'};
const _rsTs=t=>{ if(!t) return ''; const d=new Date(t); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); };
async function exportResearch(){
  const msg=document.getElementById('rs-msg'); msg.textContent='整理中…';
  try{
    await _rsLoadXLSX();
    const d=_rsData, C=_rsCodes();
    const from=document.getElementById('rs-from').value, to=document.getElementById('rs-to').value;
    const inRange=t=>{ if(!t) return true; const s=_rsTs(t).slice(0,10); return (!from||s>=from)&&(!to||s<=to); };
    const recT=r=>r.startedAt||Date.parse((r.date||'')+'T'+(r.time||'00:00:00'))||0;
    const recs=d.recs.filter(r=>inRange(recT(r))).sort((a,b)=>recT(a)-recT(b));
    const withText=document.getElementById('rs-essay-text').checked;
    // 考試紀錄、逐題
    const exams=[], items=[];
    recs.forEach((r,ix)=>{ const eid='E'+String(ix+1).padStart(4,'0'), code=C.code(r);
      exams.push({考試編號:eid, 參與者:code, 日期:r.date||'', 開始時間:_rsTs(r.startedAt), 結束時間:_rsTs(r.endedAt), 總秒數:r.durationSec??'', 實際作答秒數:r.activeSec??'',
        科目:(r.subjects||[]).map(s=>_rsSN[s]||s).join('、'), 年份:(r.years||[]).join('、'), 題數:r.total??'', 答對:r.correct??'', 分數:r.pct??'',
        出題順序:({sequential:'依序',seq:'依序',random:'隨機'})[(r.settings||{}).order]||(r.settings||{}).order||'', 看答案方式:({end:'全部做完再看',each:'逐題看答案',now:'逐題看答案'})[(r.settings||{}).reveal]||((r.settings||{}).reveal?'逐題看答案':''), 每題限時秒數:(r.settings||{}).timer||'', 錯題複習:(r.settings||{}).review?'是':''});
      (r.questions||[]).forEach((q,i)=>items.push({考試編號:eid, 參與者:code, 題序:i+1, 科目:_rsSN[q.subject]||q.subject||'', 年份:q.yr||'', 題目開頭:String(q.q||'').replace(/<[^>]+>/g,'').slice(0,30),
        作答:q.chosen==null?'':'ABCD'[q.chosen], 正解:'ABCD'[q.ans]||'', 對錯:q.chosen==null?'未作答':(q.correct?'對':'錯'), 送分題:q.free?'是':'', 停留秒數:q.sec??'', 第一次作答秒數:q.firstSec??'', 改答次數:q.changes??''})); });
    // 問答題
    const essays=d.essays.filter(e=>inRange(e.createdAt)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(e=>Object.assign({參與者:C.code(e), 科目:_rsSN[e.subject]||e.subject||'', 年份:e.yr||'', 題:e.label||('第 '+e.no+' 題'), 配分:e.pts??'', 字數:String(e.answer||'').length,
      狀態:({self:'自評',submitted:'待批改',graded:'已批改'})[e.status]||e.status, 自評分數:e.selfScore??'', 老師分數:e.teacherScore??'', 作答時間:_rsTs(e.createdAt), 批改時間:_rsTs(e.gradedAt)}, withText?{回答內容:e.answer||'', 老師評語:e.teacherComment||''}:{}));
    // 使用紀錄
    const usage=d.usage.filter(u=>inRange(u.at)).sort((a,b)=>a.at-b.at).map(u=>({時間:_rsTs(u.at), 參與者:u.uid?(C.map['u:'+u.uid]||''):(u.gid?C.gcode(u.gid):''), 事件:u.event, 細節:u.detail==null?'':(typeof u.detail==='string'?u.detail:JSON.stringify(u.detail)), 裝置:u.dev||'', 工作階段:u.sid||''}));
    // 參與者
    const parts=Object.entries(C.map).map(([k,code])=>{ const mine=x=>C.key(x)===k; const rs=d.recs.filter(mine); const es=d.essays.filter(mine); const us=d.usage.filter(u=>'u:'+u.uid===k);
      const u=d.users.find(x=>C.key(Object.assign({},x,{name:x.name||x._id}))===k)||{};
      const times=[...rs.map(recT),...es.map(e=>e.createdAt||0),...us.map(x=>x.at)].filter(Boolean);
      return {參與者:code, 註冊日期:String(u.createdAt||'').slice(0,10), 考試次數:rs.length, 平均分數:rs.length?Math.round(rs.reduce((a,r)=>a+(r.pct||0),0)/rs.length):'', 問答題次數:es.length, 使用紀錄筆數:us.length,
        第一次使用:times.length?_rsTs(Math.min(...times)):'', 最後一次使用:times.length?_rsTs(Math.max(...times)):''}; }).sort((a,b)=>a.參與者.localeCompare(b.參與者));
    const info=[['美娟華語工作室 模擬考網站 研究資料（去識別化）'],['匯出時間',_rsTs(Date.now())],['日期範圍',(from||'不限')+' ～ '+(to||'不限')],[''],
      ['參與者代號','學習者依第一次使用時間編為 P001、P002…；訪客編為 G001…。不含姓名、帳號、信箱。'],
      ['考試紀錄','每次交卷一列。開始／結束時間、總秒數、實際作答秒數（切到其他分頁的時間不算）。v3.28 之前的紀錄沒有時間資料。'],
      ['逐題作答','每次考試的每一題一列。停留秒數＝這題畫面停留時間（可能來回多次，合計）；第一次作答秒數＝第一次選答案前的停留時間；改答次數＝「全部做完再看答案」模式下改選的次數。'],
      ['問答題','每次自評或送批改一列。'+(withText?'包含學生回答與老師評語。':'不含回答內容。')],
      ['使用紀錄','網站操作事件：visit 打開網站、login 登入、guest_start 訪客試做、exam_start 開始測驗、exam_finish 交卷、exam_leave_noanswer 沒作答就離開、review_start 錯題複習、open 打開頁面、download_pdf 下載 PDF、share_result 分享成績、leave 離開網站（細節為停留秒數）。']];
    const wb=XLSX.utils.book_new();
    const add=(name,rows,head)=>{ const ws=rows.length?XLSX.utils.json_to_sheet(rows):XLSX.utils.aoa_to_sheet([head||['（沒有資料）']]); XLSX.utils.book_append_sheet(wb, ws, name); };
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), '說明');
    add('參與者',parts); add('考試紀錄',exams); add('逐題作答',items); add('問答題',essays); add('使用紀錄',usage);
    XLSX.writeFile(wb, '研究資料_去識別化_'+_rsTs(Date.now()).slice(0,10)+'.xlsx');
    msg.textContent='已匯出：'+parts.length+' 位參與者、'+exams.length+' 次考試、'+items.length+' 題作答、'+essays.length+' 份問答題、'+usage.length+' 筆使用紀錄';
  }catch(e){ console.warn(e); msg.textContent='匯出失敗：'+(e.message||e); }
}
async function exportCodeMap(){
  if(!confirm('對照表含有學生姓名與信箱，只能自己保存，不能放進論文或分享。要匯出嗎？')) return;
  const msg=document.getElementById('rs-msg');
  try{ await _rsLoadXLSX(); const d=_rsData, C=_rsCodes();
    const rows=Object.entries(C.map).map(([k,code])=>{ const u=d.users.find(x=>C.key(Object.assign({},x,{name:x.name||x._id}))===k)||{}; return {參與者:code, 帳號名稱:u.name||u._id||k.replace(/^[un]:/,''), 顯示名稱:u.displayName||'', 信箱:u.email||''}; }).sort((a,b)=>a.參與者.localeCompare(b.參與者));
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), '代號對照'); XLSX.writeFile(wb,'代號對照表_請勿外流_'+_rsTs(Date.now()).slice(0,10)+'.xlsx');
    msg.textContent='已匯出對照表（'+rows.length+' 人）';
  }catch(e){ msg.textContent='匯出失敗：'+(e.message||e); }
}
